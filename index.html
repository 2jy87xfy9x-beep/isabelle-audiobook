async function renderBookshelfList() {
  const list = document.getElementById('bs-list');
  list.innerHTML = '';
  const stored = await getAllBooks();
  if (stored.length === 0) {
    const p = document.createElement('p');
    p.className = 'bs-empty';
    p.textContent = 'No books yet — click + Add book to load a .json file.';
    list.appendChild(p);
    return;
  }
  for (const entry of stored.sort((a, b) => (b.lastOpened || 0) - (a.lastOpened || 0))) {
    const card = document.createElement('div');
    card.className = 'bs-card';
    card.innerHTML = `
      <div class="bs-card-info">
        <div class="bs-card-title">${bsEsc(entry.title)}</div>
        ${entry.author ? `<div class="bs-card-author">${bsEsc(entry.author)}</div>` : ''}
      </div>
      <button class="bs-card-remove bar-tip" data-tip="Remove from library" aria-label="Remove">✕</button>
    `;
    card.querySelector('.bs-card-remove').addEventListener('click', async (e) => {
      e.stopPropagation();
      await removeBook(entry.id);
      renderBookshelfList();
    });
    card.addEventListener('click', async () => {
      await saveBook({ ...entry, lastOpened: Date.now() });
      location.href = `index.html?id=${encodeURIComponent(entry.id)}`;
    });
    list.appendChild(card);
  }
}

async function bsAddBook() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = async () => {
    const file = input.files[0];
    if (!file) return;
    let parsed;
    try { parsed = JSON.parse(await file.text()); }
    catch { showFeedback('Could not read file — must be valid JSON.'); return; }
    // Support both bundle format {book,context,fiction} and bare book.json
    const bookData    = parsed.book    || parsed;
    const contextData = parsed.context || { entries: [] };
    const fictionData = parsed.fiction || { gap_scenes: [], letter_reimaginings: [] };
    const title  = bookData.title  || file.name.replace(/\.json$/i, '');
    const author = bookData.author || '';
    const id = `book-${Date.now()}`;
    await saveBook({ id, bundle: { book: bookData, context: contextData, fiction: fictionData }, title, author, lastOpened: Date.now() });
    renderBookshelfList();
  };
  input.click();
}

function bsEsc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function initBookshelf() {
  document.getElementById('btn-sky-library').addEventListener('click', initSkyLibrary);
  document.getElementById('btn-bookshelf').addEventListener('click', toggleBookshelf);
  document.getElementById('bs-btn-add').addEventListener('click', bsAddBook);
  document.getElementById('bs-btn-close').addEventListener('click', closeBookshelf);
}

// ── §14 APP ──────────────────────────────────────────────────────────────────

const LS = (k) => `isabelle-v2-${k}`;

let book = null;
let context = null;
let fiction = null;
let letters = [];
let contextIndex = {};
let currentLetterIdx = 0;
let sortedAliases = [];
let activeView = 'plain_english';
let player = null;
let rangeModeActive = false;
let rangeStart = null;
const lettersRead = new Set();
const narratorModes = ['letters', 'context', 'both', 'silent'];
let narratorModeIndex = 0;

function currentLetter() {
  return letters[currentLetterIdx];
}

function letterViewKey(letter) {
  const memKey = LS(`view-memory-${letter.id}`);
  return localStorage.getItem(memKey) || activeView;
}

function paragraphSourceForPlayer(letter, viewKey) {
  if (viewKey === 'photocopy' || viewKey === 'handwriting_style') {
    return letter.views?.original_french || letter.views?.plain_english || '';
  }
  return letter.views?.[viewKey] || letter.views?.plain_english || '';
}

function refreshPlayerData() {
  if (!player) return;
  const letter = currentLetter();
  if (!letter) return;
  const vk = letterViewKey(letter);
  const text = paragraphSourceForPlayer(letter, vk);
  const paras = text.split(/\n\n+/).filter(Boolean).map((t) => ({ text: t }));
  player.setData({
    paragraphs: paras,
    sortedAliases,
    contextEntries: contextIndex,
  });
  player.setMode(narratorModes[narratorModeIndex] || 'letters');
  const bodyParas = document.querySelectorAll('.letter-paragraph');
  initFocusMode([...bodyParas]);
  applyMode(0);
}

async function init() {
  initTokens();
  initPrimitives();
  initBookshelf();
  initToolbar();
  initStudio();
  if (!window.speechSynthesis) {
    document.getElementById('loading').textContent =
      'Your browser does not support text-to-speech. Try Chrome or Edge.';
    return;
  }

  let data;
  try {
    data = await loadData();
  } catch (e) {
    if (e.code === 'no_books') {
      document.getElementById('loading').style.display = 'none';
      initSkyLibrary();
      return;
    }
    if (e.message === 'book_not_found' || e.message === 'permission_denied') {
      document.getElementById('loading').style.display = 'none';
      openBookshelf();
      return;
    }
    document.getElementById('loading').textContent =
      'Could not load book. Check your connection and reload.';
    return;
  }

  book = data.book;
  context = data.context;
  fiction = data.fiction || { gap_scenes: [], letter_reimaginings: [] };
  letters = book.letters;
  contextIndex = Object.fromEntries((context.entries || []).map((e) => [e.id, e]));

  const aliasMap = buildAliasMap(context.entries || []);
  sortedAliases = buildSortedAliases(aliasMap);

  activeView =
    localStorage.getItem(LS('view-default')) || book.defaultView || 'plain_english';
  document.documentElement.dataset.theme =
    localStorage.getItem(LS('theme')) || 'dark';
  document.documentElement.style.setProperty(
    '--font-size',
    `${localStorage.getItem(LS('font-size')) || '16'}px`
  );

  const localPos = loadLocalPosition();
  const resolvedPos = resolvePosition(localPos, book.lastPosition);
  currentLetterIdx = Math.max(
    0,
    letters.findIndex((l) => l.id === resolvedPos?.letter_id)
  );
  if (currentLetterIdx < 0) currentLetterIdx = 0;

  applyLayoutFromStorage();
  buildSidebar();
  syncSidebarRevealFocus();
  document.getElementById('loading').style.display = 'none';
  renderCurrentLetter();

  initPlayer();
  initProgress(() => book);
  initSync({
    contextPanel: document.getElementById('context-content'),
    contextEntries: contextIndex,
    onEntryActivate: renderContextEntry,
  });
  initEditor({
    onPause: () => player?.pause(),
    onSave: () => saveAll(),
  });
  initKeyboardNav({
    onPrev: () => goToLetter(currentLetterIdx - 1),
    onNext: () => goToLetter(currentLetterIdx + 1),
    onToggleContext: toggleContextPanel,
    onToggleChrome: toggleChrome,
    onPeek: () => {},
    onRangeCopy: toggleRangeMode,
  });
  initSmartScroll(document.getElementById('letter-content'));

  const sfPanel = document.getElementById('smart-features-panel');
  sfPanel.innerHTML = '';
  sfPanel.appendChild(renderTogglePanel(document));

  wireControls();
  initPanelResize();
  initBottomBarResize();
  initTooltipPositioning();
  window.addEventListener('resize', syncSidebarRevealFocus);

  const storedMode = localStorage.getItem(LS('narrator-mode'));
  if (storedMode) {
    const i = narratorModes.indexOf(storedMode);
    if (i >= 0) narratorModeIndex = i;
  }
}

function renderCurrentLetter() {
  const letter = currentLetter();
  if (!letter) return;
  const container = document.getElementById('letter-content');
  container.innerHTML = '';

  const vk = letterViewKey(letter);

  const meta = renderLetterMeta(letter, document);
  const numEl = meta.querySelector('[data-letter-number]');
  attachLongPress(numEl, () =>
    document.dispatchEvent(
      new KeyboardEvent('keydown', { key: 'E', shiftKey: true, bubbles: true })
    )
  );
  container.appendChild(meta);

  const viewSwitcher = renderViewSwitcher(
    letter,
    vk,
    (view) => {
      localStorage.setItem(LS(`view-memory-${letter.id}`), view);
      renderCurrentLetter();
    },
    document
  );
  container.appendChild(viewSwitcher);

  const body = renderLetterBody(letter, vk, sortedAliases, document);
  body.querySelectorAll('.ctx-ref').forEach((span) => {
    span.addEventListener('click', () => {
      activateEntry(span.dataset.refId, { pulse: true });
      openContextPanel();
      renderContextEntry(span.dataset.refId);
    });
    span.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        span.click();
      }
    });
  });
  body.querySelectorAll('.letter-paragraph').forEach((p, i) => {
    p.addEventListener('click', () => {
      if (isEditorUnlocked()) {
        openInlineEdit(p);
      } else {
        handleParaClick(p, i);
      }
    });
    attachLongPress(p, () => openInlineEdit(p));
  });
  container.appendChild(body);

  // Letter Integrity Guardian — highlight artefacts when feature is enabled
  if (isEnabled('letter-guardian')) {
    const rawText = letter.views?.original_french || '';
    guardianHighlight(body, rawText, document);
    const summary = guardianSummary(rawText);
    let banner = document.getElementById('guardian-banner');
    if (summary) {
      if (!banner) {
        banner = document.createElement('div');
        banner.id = 'guardian-banner';
        banner.className = 'guardian-banner';
        container.prepend(banner);
      }
      banner.textContent = `⚠ Integrity issues in original_french: ${summary}`;
      banner.hidden = false;
    } else if (banner) {
      banner.hidden = true;
    }
  }

  const nav = renderLetterNav(
    letter,
    letters.length,
    () => goToLetter(currentLetterIdx - 1),
    () => goToLetter(currentLetterIdx + 1),
    document
  );
  container.appendChild(nav);

  document.querySelectorAll('.nav-letter').forEach((el) => {
    el.classList.toggle('active', el.dataset.letterId === letter.id);
  });

  syncToLetter(letter);
  refreshPlayerData();
  renderTrackBar();

  lettersRead.add(letter.id);
  savePosition({
    letter_id: letter.id,
    paragraph_index: 0,
    scroll_offset: 0,
    active_view: vk,
    timestamp: Date.now(),
  });
}

function goToLetter(idx, { addUndo = true } = {}) {
  const prev = currentLetterIdx;
  currentLetterIdx = Math.max(0, Math.min(idx, letters.length - 1));
  const next = currentLetter();
  if (!next?.complete) {
    const forward = idx > prev;
    let step = forward ? 1 : -1;
    let guard = 0;
    while (guard++ < letters.length && !letters[currentLetterIdx]?.complete) {
      currentLetterIdx = Math.max(0, Math.min(currentLetterIdx + step, letters.length - 1));
    }
  }
  if (addUndo && isEnabled('undo-navigation')) {
    showUndoNav(`← Letter ${letters[prev]?.letter_number ?? prev + 1}`, () =>
      goToLetter(prev, { addUndo: false })
    );
  }
  rangeStart = null;
  renderCurrentLetter();
}

function isMobileLayout() {
  return window.matchMedia('(max-width:767px)').matches;
}

function buildSidebar() {
  const headLbl = document.getElementById('sidebar-head-label');
  if (headLbl) {
    if (book.chapters?.length === 1) {
      const t = book.chapters[0].title || '';
      headLbl.textContent = t.length > 42 ? `${t.slice(0, 40)}…` : t || 'Letters';
    } else {
      headLbl.textContent = 'Letters';
    }
  }
  const nav = document.getElementById('sidebar-nav');
  nav.innerHTML = '';
  for (const ch of book.chapters) {
    const heading = document.createElement('div');
    heading.className = 'nav-chapter-heading';
    heading.textContent = ch.title;
    nav.appendChild(heading);
    const chLetters = letters.filter((l) => l.chapter_id === ch.id);
    chLetters.forEach((letter) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'nav-letter' + (letter.complete ? '' : ' placeholder');
      btn.dataset.letterId = letter.id;
      btn.setAttribute('role', 'listitem');
      btn.textContent = letter.date_display
        ? `${letter.letter_number}. ${letter.date_display}`
        : `${letter.letter_number}. — not yet added`;
      if (!letter.complete) btn.disabled = true;
      btn.dataset.tip = btn.textContent;
      btn.addEventListener('click', () => {
        goToLetter(letters.indexOf(letter));
        closeSidebar();
      });
      nav.appendChild(btn);
    });
  }
}

function openContextPanel() {
  const pane = document.getElementById('context-pane');
  pane.classList.remove('collapsed');
  pane.classList.add('open');
}

function closeContextPanel() {
  const pane = document.getElementById('context-pane');
  pane.classList.add('collapsed');
  pane.classList.remove('open');
}

function toggleContextPanel() {
  const pane = document.getElementById('context-pane');
  if (pane.classList.contains('collapsed')) openContextPanel();
  else closeContextPanel();
}

// ── Book 2 track management ───────────────────────────────────────────────────

const BOOK2_TRACKS = [
  { id: 'contextual',        label: 'Contextual' },
  { id: 'brief',             label: 'Brief' },
  { id: 'encyclopedic',      label: 'Encyclopedic' },
  { id: 'fiction-gaps',      label: 'Fiction: Gaps' },
  { id: 'fiction-letters',   label: 'Fiction: Letters' },
];
const BOOK2_TRACK_KEY        = 'isabelle-v2-book2-track';
const BOOK2_TRACK_LETTER_KEY = (id) => `isabelle-v2-book2-track-${id}`;

function getBook2Track(letterId) {
  return localStorage.getItem(BOOK2_TRACK_LETTER_KEY(letterId))
    || localStorage.getItem(BOOK2_TRACK_KEY)
    || 'contextual';
}

function setBook2TrackGlobal(trackId) {
  localStorage.setItem(BOOK2_TRACK_KEY, trackId);
  renderTrackBar();
  const letter = currentLetter();
  if (letter) renderContextPane(letter.id);
}

function setBook2TrackLocal(letterId, trackId) {
  localStorage.setItem(BOOK2_TRACK_LETTER_KEY(letterId), trackId);
  renderTrackBar();
  renderContextPane(letterId);
}

function renderTrackBar() {
  const bar = document.getElementById('context-track-bar');
  if (!bar) return;
  const letter   = currentLetter();
  const letterId = letter?.id;
  const global   = localStorage.getItem(BOOK2_TRACK_KEY) || 'contextual';
  const local    = letterId ? localStorage.getItem(BOOK2_TRACK_LETTER_KEY(letterId)) : null;
  const active   = local || global;

  bar.innerHTML = '';

  // Global track pills
  const globalRow = document.createElement('div');
  globalRow.className = 'track-row track-row-global';
  for (const t of BOOK2_TRACKS) {
    if (!isEnabled('fiction-tracks') && t.id.startsWith('fiction')) continue;
    const btn = document.createElement('button');
    btn.className = 'track-pill' + (t.id === global ? ' global-active' : '') + (t.id === active ? ' active' : '');
    btn.textContent = t.label;
    btn.dataset.track = t.id;
    btn.dataset.tip = 'Set as default track';
    btn.addEventListener('click', () => setBook2TrackGlobal(t.id));
    globalRow.appendChild(btn);
  }
  bar.appendChild(globalRow);

  // Per-letter override row (only if a letter is loaded)
  if (letterId) {
    const localRow = document.createElement('div');
    localRow.className = 'track-row track-row-local';
    const lbl = document.createElement('span');
    lbl.className = 'track-override-label';
    lbl.textContent = 'This letter:';
    localRow.appendChild(lbl);
    for (const t of BOOK2_TRACKS) {
      if (!isEnabled('fiction-tracks') && t.id.startsWith('fiction')) continue;
      const btn = document.createElement('button');
      btn.className = 'track-pill track-pill-sm' + (t.id === local ? ' local-active' : '') + (t.id === active ? ' active' : '');
      btn.textContent = t.label;
      btn.dataset.track = t.id;
      btn.dataset.tip = local === t.id ? 'Clear this override' : 'Override for this letter';
      btn.addEventListener('click', () => {
        if (local === t.id) {
          localStorage.removeItem(BOOK2_TRACK_LETTER_KEY(letterId));
          renderTrackBar();
          renderContextPane(letterId);
        } else {
          setBook2TrackLocal(letterId, t.id);
        }
      });
      localRow.appendChild(btn);
    }
    bar.appendChild(localRow);
  }
}

function renderContextPane(letterId) {
  const track = getBook2Track(letterId);
  if (track === 'fiction-gaps' || track === 'fiction-letters') {
    renderFictionContent(track, letterId);
  } else {
    // show last activated entity entry, or letter-linked entries
    const letter = letters.find(l => l.id === letterId);
    const refs = letter?.contextRefs || [];
    if (refs.length > 0) renderContextEntry(refs[0]);
    else {
      const container = document.getElementById('context-content');
      container.innerHTML = '';
      const p = document.createElement('p');
      p.style.cssText = 'font-size:.75rem;color:var(--text-d);font-style:italic;margin-top:8px';
      p.textContent = 'Click a highlighted word in the letter to open a context entry.';
      container.appendChild(p);
    }
  }
}

function renderFictionContent(track, letterId) {
  if (!isEnabled('fiction-tracks')) return;
  const container = document.getElementById('context-content');
  container.innerHTML = '';

  // Fiction header
  const badge = document.createElement('div');
  badge.className = 'fiction-badge';
  badge.textContent = 'FICTION';
  container.appendChild(badge);
  const disclaimer = document.createElement('p');
  disclaimer.className = 'fiction-disclaimer';
  disclaimer.textContent = 'Historical fiction — imaginative reconstruction, not fact';
  container.appendChild(disclaimer);

  let text = '';
  let title = '';

  if (track === 'fiction-gaps') {
    const scene = fiction?.gap_scenes?.find(s => s.after_letter === letterId);
    text  = scene?.text  || '';
    title = scene?.title || '';
  } else {
    const reim = fiction?.letter_reimaginings?.find(r => r.letter_id === letterId);
    text = reim?.text || '';
  }

  if (title) {
    const h3 = document.createElement('h3');
    h3.className = 'fiction-title';
    h3.textContent = title;
    container.appendChild(h3);
  }

  if (!text) {
    const notice = document.createElement('p');
    notice.style.cssText = 'font-size:.75rem;color:var(--text-d);font-style:italic;margin-top:8px';
    notice.textContent = track === 'fiction-gaps'
      ? 'No gap scene written yet for this letter.'
      : 'No reimagining written yet for this letter.';
    container.appendChild(notice);
    return;
  }

  for (const para of text.split(/\n\n+/).filter(Boolean)) {
    const p = document.createElement('p');
    p.className = 'fiction-paragraph';
    p.textContent = para;
    container.appendChild(p);
  }
}

function renderContextEntry(entryId) {
  const entry = contextIndex[entryId];
  if (!entry) return;

  // Check if current track is fiction — if so, show fiction content instead
  const letter   = currentLetter();
  const track    = letter ? getBook2Track(letter.id) : 'contextual';
  if (track === 'fiction-gaps' || track === 'fiction-letters') {
    renderFictionContent(track, letter.id);
    return;
  }

  const container = document.getElementById('context-content');
  container.innerHTML = '';
  const h2 = document.createElement('h2');
  h2.style.cssText = 'font-size:.9rem;margin-bottom:8px;color:var(--accent)';
  h2.textContent = entry.name;
  const sub = document.createElement('p');
  sub.style.cssText = 'font-size:.72rem;color:var(--text-d);margin-bottom:16px';
  sub.textContent = entry.short || '';
  container.appendChild(h2);
  container.appendChild(sub);
  if (entry.images?.length) {
    entry.images
      .filter((img) => img.url)
      .forEach((img) => {
        const figure = document.createElement('figure');
        const image = document.createElement('img');
        image.src = img.url;
        image.alt = img.alt || '';
        image.style.cssText = 'max-width:100%;margin-bottom:6px';
        const cap = document.createElement('figcaption');
        cap.style.cssText = 'font-size:.62rem;color:var(--text-d)';
        cap.textContent = img.caption || '';
        figure.appendChild(image);
        figure.appendChild(cap);
        container.appendChild(figure);
      });
  }

  // Read from the correct depth array (schema_version 3) or fall back to legacy `content`
  const depthKey = `content_${track}`;
  const content  = entry[depthKey] ?? entry.content_contextual ?? entry.content ?? [];

  if (content.length === 0) {
    const notice = document.createElement('p');
    notice.style.cssText = 'font-size:.75rem;color:var(--text-d);font-style:italic;margin-top:8px';
    notice.textContent = 'No entry written yet.';
    container.appendChild(notice);
  } else {
    for (const para of content) {
      const p = document.createElement('p');
      p.style.cssText =
        'font-family:var(--book-font);font-size:.88rem;line-height:1.75;color:var(--text-m);margin-bottom:12px';
      p.textContent = para.text;
      container.appendChild(p);
    }
  }
  if (isEditorUnlocked()) {
    const mapEditor = renderMappingEditor(
      {
        letter: currentLetter(),
        contextEntries: contextIndex,
        onLink: (id) => {
          const L = currentLetter();
          if (!L.contextRefs.includes(id)) L.contextRefs.push(id);
          if (!contextIndex[id].letterRefs.includes(L.id))
            contextIndex[id].letterRefs.push(L.id);
          showFeedback('Connection added');
        },
        onUnlink: (id) => {
          const L = currentLetter();
          L.contextRefs = L.contextRefs.filter((r) => r !== id);
          contextIndex[id].letterRefs = contextIndex[id].letterRefs.filter(
            (x) => x !== L.id
          );
          showFeedback('Connection removed');
        },
        onCreate: (name, wrap) => {
          showFeedback(`Creating entry: ${name}`);
          wrap.remove();
        },
      },
      document
    );
    container.appendChild(mapEditor);
  }
}

function initPlayer() {
  player = new Player({
    onParagraphAdvance: (idx) => {
      const total = player._paragraphs?.length || 1;
      updateNarratorLine(idx, total);
      document.querySelectorAll('.letter-paragraph.current').forEach((p) =>
        p.classList.remove('current')
      );
      const el = document.querySelector(`.letter-paragraph[data-paragraph-index="${idx}"]`);
      if (el) {
        el.classList.add('current');
        el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
      applyMode(idx);
    },
    onWord: () => {},
    onEnd: () => {
      document.getElementById('btn-play').textContent = '▶';
    },
    onContextSnippet: (id) => {
      activateEntry(id, { pulse: true });
      renderContextEntry(id);
    },
  });

  const loadingOpt =
    '<option value="" disabled selected>Loading voices…</option>';
  let voiceChangeBound = false;

  function populateVoiceSelectors() {
    const voices = window.speechSynthesis.getVoices();
    const lv = localStorage.getItem(LS('letter-voice')) || '';
    const cv = localStorage.getItem(LS('context-voice')) || '';
    const esc = (s) =>
      String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
    const lvSel = document.getElementById('letter-voice-select');
    const cvSel = document.getElementById('context-voice-select');
    if (!lvSel || !cvSel) return;

    if (!voices.length) {
      lvSel.innerHTML = loadingOpt;
      cvSel.innerHTML = loadingOpt;
      player.autoSelectVoices();
      return;
    }

    const opts = voices
      .map((v) => `<option value="${esc(v.voiceURI)}">${esc(v.name)} (${esc(v.lang)})</option>`)
      .join('');
    lvSel.innerHTML = opts;
    cvSel.innerHTML = opts;
    player.autoSelectVoices();
    if (lv && [...lvSel.options].some((o) => o.value === lv)) lvSel.value = lv;
    else if (player.letterVoice) lvSel.value = player.letterVoice.voiceURI;
    if (cv && [...cvSel.options].some((o) => o.value === cv)) cvSel.value = cv;
    else if (player.contextVoice) cvSel.value = player.contextVoice.voiceURI;
    player.setLetterVoice(lvSel.value);
    player.setContextVoice(cvSel.value);

    if (!voiceChangeBound) {
      voiceChangeBound = true;
      lvSel.addEventListener('change', () => {
        player.setLetterVoice(lvSel.value);
        localStorage.setItem(LS('letter-voice'), lvSel.value);
      });
      cvSel.addEventListener('change', () => {
        player.setContextVoice(cvSel.value);
        localStorage.setItem(LS('context-voice'), cvSel.value);
      });
    }
  }

  populateVoiceSelectors();
  window.speechSynthesis.addEventListener('voiceschanged', populateVoiceSelectors);
  [0, 80, 250, 700, 2000].forEach((ms) =>
    setTimeout(() => populateVoiceSelectors(), ms)
  );

  refreshPlayerData();
}

function handleParaClick(el, paraIdx) {
  if (rangeModeActive) {
    handleRangeClick(el);
    return;
  }
  player?.setIndex(paraIdx);
  document.querySelectorAll('.letter-paragraph.current').forEach((p) =>
    p.classList.remove('current')
  );
  el.classList.add('current');
  applyMode(paraIdx);
}

function toggleRangeMode() {
  rangeModeActive = !rangeModeActive;
  document.body.classList.toggle('range-mode', rangeModeActive);
  rangeStart = null;
  document.querySelectorAll('.rp-start,.rp-end').forEach((el) => {
    el.classList.remove('rp-start', 'rp-end');
  });
}

function handleRangeClick(el) {
  if (!rangeStart) {
    rangeStart = el;
    el.classList.add('rp-start');
  } else {
    el.classList.add('rp-end');
    const text = [rangeStart.textContent, el.textContent].join(' … ');
    navigator.clipboard.writeText(text).then(() => {
      showFeedback('Copied');
      toggleRangeMode();
    }).catch(() => {
      // Clipboard API unavailable (e.g. HTTP) — fall back to execCommand
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showFeedback('Copied');
      } catch {
        showFeedback('Copy failed — select text manually');
      }
      toggleRangeMode();
    });
  }
}

function applyLayoutFromStorage() {
  const app = document.getElementById('app');
  const sw = parseInt(localStorage.getItem(LS('sidebar-w')) || '', 10);
  const cw = parseInt(localStorage.getItem(LS('context-w')) || '', 10);
  if (Number.isFinite(sw))
    app.style.setProperty(
      '--sidebar-w',
      `${Math.max(180, Math.min(520, sw))}px`
    );
  if (Number.isFinite(cw))
    app.style.setProperty(
      '--context-w',
      `${Math.max(200, Math.min(560, cw))}px`
    );
  const bottomBar = document.getElementById('bottom-bar');
  if (localStorage.getItem(LS('bottom-collapsed')) === '1')
    bottomBar.classList.add('collapsed');
  const bmh = parseInt(localStorage.getItem(LS('bottom-bar-max-h')) || '', 10);
  if (Number.isFinite(bmh))
    bottomBar.style.setProperty(
      '--bottom-bar-max-h',
      `${Math.max(96, Math.min(480, bmh))}px`
    );
}

function initPanelResize() {
  const app = document.getElementById('app');
  const gS = document.getElementById('gutter-sidebar');
  const gC = document.getElementById('gutter-context');

  const parsePx = (val, fallback) => {
    const n = parseInt(String(val).trim(), 10);
    return Number.isFinite(n) ? n : fallback;
  };

  const bind = (gutter, mode) => {
    gutter.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      e.preventDefault();
      const startX = e.clientX;
      const cs = getComputedStyle(app);
      const startSw = parsePx(cs.getPropertyValue('--sidebar-w'), 260);
      const startCw = parsePx(cs.getPropertyValue('--context-w'), 320);

      const onMove = (ev) => {
        const dx = ev.clientX - startX;
        if (mode === 'sidebar') {
          const w = Math.max(180, Math.min(520, startSw + dx));
          app.style.setProperty('--sidebar-w', `${w}px`);
        } else {
          if (document.getElementById('context-pane').classList.contains('collapsed'))
            return;
          const w = Math.max(200, Math.min(560, startCw + dx));
          app.style.setProperty('--context-w', `${w}px`);
        }
      };
      const onUp = () => {
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
        const cs2 = getComputedStyle(app);
        if (mode === 'sidebar') {
          localStorage.setItem(
            LS('sidebar-w'),
            String(parsePx(cs2.getPropertyValue('--sidebar-w'), 260))
          );
        } else if (!document.getElementById('context-pane').classList.contains('collapsed')) {
          localStorage.setItem(
            LS('context-w'),
            String(parsePx(cs2.getPropertyValue('--context-w'), 320))
          );
        }
      };
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
    });

    gutter.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      e.preventDefault();
      if (mode === 'sidebar') {
        app.style.removeProperty('--sidebar-w');
        localStorage.removeItem(LS('sidebar-w'));
      } else {
        app.style.removeProperty('--context-w');
        localStorage.removeItem(LS('context-w'));
      }
    });
  };

  bind(gS, 'sidebar');
  bind(gC, 'context');
}

function initBottomBarResize() {
  const bar = document.getElementById('bottom-bar');
  const gutter = document.getElementById('bottom-bar-resize');
  if (!bar || !gutter) return;

  const parseMaxH = () => {
    const v = getComputedStyle(bar).getPropertyValue('--bottom-bar-max-h').trim();
    const n = parseInt(v, 10);
    return Number.isFinite(n) ? n : 400;
  };

  const applyH = (px) => {
    const h = Math.max(36, Math.min(480, Math.round(px)));
    bar.style.setProperty('--bottom-bar-max-h', `${h}px`);
    localStorage.setItem(LS('bottom-bar-max-h'), String(h));
  };

  gutter.addEventListener('pointerdown', (e) => {
    if (e.button !== 0 || bar.classList.contains('collapsed')) return;
    e.preventDefault();
    const startY = e.clientY;
    const startH = parseMaxH();
    const onMove = (ev) => {
      const dy = startY - ev.clientY;
      applyH(startH + dy);
    };
    const onUp = () => {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
    };
    document.body.style.cursor = 'row-resize';
    document.body.style.userSelect = 'none';
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
  });

  gutter.addEventListener('keydown', (e) => {
    if (bar.classList.contains('collapsed')) return;
    if (e.key === 'ArrowUp') {
      e.preventDefault();
      applyH(parseMaxH() + 12);
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      applyH(parseMaxH() - 12);
    } else if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      bar.style.removeProperty('--bottom-bar-max-h');
      localStorage.removeItem(LS('bottom-bar-max-h'));
    }
  });
}

function initTooltipPositioning() {
  const tip = document.getElementById('app-tooltip');
  if (!tip) return;
  let hideTimer = null;

  document.addEventListener('mouseover', (e) => {
    const el = e.target.closest('[data-tip]');
    clearTimeout(hideTimer);
    if (!el?.dataset.tip) {
      tip.classList.remove('visible');
      return;
    }
    tip.textContent = el.dataset.tip;
    const r = el.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const x = Math.round(Math.max(110, Math.min(window.innerWidth - 110, cx)));
    // Show above the element
    const bottom = Math.round(window.innerHeight - r.top + 10);
    tip.style.left = `${x}px`;
    tip.style.bottom = `${bottom}px`;
    tip.classList.add('visible');
  });

  document.addEventListener('mouseout', (e) => {
    if (!e.target.closest('[data-tip]')) return;
    hideTimer = setTimeout(() => tip.classList.remove('visible'), 80);
  });
}

function letterPlainTextForTranslate() {
  const root = document.getElementById('letter-content');
  if (!root) return '';
  const sel =
    '.letter-salutation,.letter-paragraph,.letter-closing,.letter-meta,.view-missing';
  const parts = [];
  root.querySelectorAll(sel).forEach((el) => {
    const t = el.textContent.replace(/\s+/g, ' ').trim();
    if (t) parts.push(t);
  });
  return parts.join('\n\n');
}

function flashOpFeedback(msg) {
  const el = document.getElementById('op-feedback');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('visible');
  setTimeout(() => el.classList.remove('visible'), 2200);
}

function openLetterInGoogleTranslate() {
  let text = letterPlainTextForTranslate();
  if (!text) {
    flashOpFeedback('No letter text to translate');
    return;
  }
  const max = 4500;
  if (text.length > max) {
    text = text.slice(0, max);
    flashOpFeedback('Long letter — opening first part in Translate');
  }
  const url = `https://translate.google.com/?sl=auto&tl=en&op=translate&text=${encodeURIComponent(text)}`;
  window.open(url, '_blank', 'noopener,noreferrer');
}

function syncSidebarRevealFocus() {
  const r = document.getElementById('sidebar-reveal');
  const s = document.getElementById('sidebar');
  if (!r || !s) return;
  if (isMobileLayout()) {
    r.setAttribute('aria-hidden', 'true');
    r.tabIndex = -1;
    return;
  }
  const collapsed = s.classList.contains('collapsed');
  r.setAttribute('aria-hidden', collapsed ? 'false' : 'true');
  r.tabIndex = collapsed ? 0 : -1;
}

function closeSidebar() {
  const s = document.getElementById('sidebar');
  if (isMobileLayout()) s.classList.remove('open');
  else {
    s.classList.add('collapsed');
    s.classList.remove('open');
  }
  syncSidebarRevealFocus();
}

function openSidebar() {
  const s = document.getElementById('sidebar');
  if (isMobileLayout()) s.classList.add('open');
  else {
    s.classList.remove('collapsed');
    s.classList.remove('open');
  }
  syncSidebarRevealFocus();
}

function toggleSidebar() {
  const s = document.getElementById('sidebar');
  if (isMobileLayout()) s.classList.toggle('open');
  else {
    s.classList.toggle('collapsed');
    s.classList.remove('open');
  }
  syncSidebarRevealFocus();
}

async function saveAll() {
  const letter = currentLetter();
  if (letter) {
    book.lastPosition = {
      letter_id: letter.id,
      paragraph_index: 0,
      scroll_offset: 0,
      active_view: letterViewKey(letter),
      timestamp: Date.now(),
    };
  }
  // Update IDB so refresh reflects the latest edits
  if (_currentBookId) {
    const entry = await getBook(_currentBookId);
    if (entry) await saveBook({ ...entry, bundle: { book, context, fiction }, lastOpened: Date.now() });
  }
  downloadBundle(book, context, fiction);
  showFeedback('Downloaded.');
}

  const focusModes = ['off', 'reveal', 'spotlight', 'fade_ahead', 'page'];
  let fmIdx = focusModes.indexOf(localStorage.getItem(LS('focus-mode')) || 'off');
  if (fmIdx < 0) fmIdx = 0;
  document.getElementById('btn-focus').addEventListener('click', () => {
    fmIdx = (fmIdx + 1) % focusModes.length;
    const m = focusModes[fmIdx];
    setFocusMode(m);
    localStorage.setItem(LS('focus-mode'), m);
    document.body.classList.toggle('page-mode', m === 'page');
    showFeedback(`Mode: ${m}`);
  });

  document.addEventListener('escape-pressed', () => {
    smartPanel.classList.remove('open');
    document.getElementById('export-panel').classList.remove('open');
    closeBookshelf();
    closeInlineEdit();
    if (rangeModeActive) toggleRangeMode();
  });

  document.addEventListener('click', (e) => {
    // Close smart features panel when clicking outside
    if (smartPanel.classList.contains('open') &&
        !smartPanel.contains(e.target) &&
        !document.getElementById('btn-smart').contains(e.target)) {
      smartPanel.classList.remove('open');
    }
    // Close export panel when clicking outside
    const exportPanel = document.getElementById('export-panel');
    if (exportPanel.classList.contains('open') &&
        !exportPanel.contains(e.target) &&
        !document.getElementById('btn-export').contains(e.target)) {
      exportPanel.classList.remove('open');
    }
    // Close bookshelf panel when clicking outside
    const bookshelfPanel = document.getElementById('bookshelf-panel');
    if (bookshelfPanel.classList.contains('open') &&
        !bookshelfPanel.contains(e.target) &&
        !document.getElementById('btn-bookshelf').contains(e.target)) {
      closeBookshelf();
    }
    // Close inline editor when clicking outside the editing paragraph
    const editingEl = document.querySelector('.letter-paragraph[contenteditable="true"]');
    if (editingEl &&
        !editingEl.contains(e.target) &&
        !document.getElementById('inline-toolbar')?.contains(e.target)) {
      window._editor?.closeInlineEdit();
    }
  }, { capture: false });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (smartPanel.classList.contains('open')) {
        smartPanel.classList.remove('open');
        e.preventDefault();
      }
    }
  });

  document.addEventListener('export-failed', () =>
    showFeedback('Export failed. Try a smaller selection or reload.')
  );
}

function buildExportPanel() {
  const panel = document.getElementById('export-panel');
  panel.innerHTML = `
    <div class="export-row" id="exp-scope">
      <button type="button" class="export-btn active" data-scope="this-letter">this letter</button>
      <button type="button" class="export-btn" data-scope="all-letters">all letters</button>
      <button type="button" class="export-btn" data-scope="selection">selection</button>
      <button type="button" class="export-btn" data-scope="full-book">full book</button>
    </div>
    <div class="export-row" id="exp-view">
      <button type="button" class="export-btn active" data-view="plain_english">anglais</button>
      <button type="button" class="export-btn" data-view="original_french">vieux fr</button>
      <button type="button" class="export-btn" data-view="modern_french">fr moderne</button>
      <button type="button" class="export-btn" data-view="all">all views</button>
    </div>
    <div class="export-row" id="exp-format">
      <button type="button" class="export-btn" data-format="html">html</button>
      <button type="button" class="export-btn" data-format="print">print / pdf</button>
      <button type="button" class="export-btn" data-format="plain-text">plain text</button>
    </div>
  `;

  let selectedScope = 'this-letter';
  let selectedView = 'plain_english';

  panel.querySelectorAll('[data-scope]').forEach((btn) => {
    btn.addEventListener('click', () => {
      panel.querySelectorAll('[data-scope]').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      selectedScope = btn.dataset.scope;
    });
  });
  panel.querySelectorAll('[data-view]').forEach((btn) => {
    btn.addEventListener('click', () => {
      panel.querySelectorAll('[data-view]').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      selectedView = btn.dataset.view;
    });
  });
  panel.querySelectorAll('[data-format]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const letter = currentLetter();
      let subset;
      if (selectedScope === 'this-letter') subset = [letter];
      else if (selectedScope === 'all-letters' || selectedScope === 'full-book')
        subset = letters.filter((l) => l.complete);
      else subset = [letter];

      exportLetters({
        letters: subset,
        scope: selectedScope,
        view: selectedView === 'all' ? 'all' : selectedView,
        format: btn.dataset.format,
        selectionText: window.getSelection()?.toString() || '',
      });
      panel.classList.remove('open');
      showFeedback('Exported');
    });
  });
}

let _skyW, _skyH, _skyDpr;
let _skyBgStars = [];
let _skyT = 0;
let _skyFrame = null;

let _skyBurstProgress = 0;
let _skyBurstReverse = false;

let _skyTargetZoom = 1, _skyTargetPanX = 0;

function _skyEl(id) { return document.getElementById(id); }

function skyResize() {
  const wrap = _skyEl('sky-overlay');
  _skyDpr = window.devicePixelRatio || 1;
  _skyW = wrap.clientWidth;
  _skyH = wrap.clientHeight;
  for (const id of ['sky-bg','sky-main']) {
    const c = _skyEl(id);
    c.width = _skyW * _skyDpr; c.height = _skyH * _skyDpr;
    c.style.width = _skyW + 'px'; c.style.height = _skyH + 'px';
    c.getContext('2d').setTransform(_skyDpr, 0, 0, _skyDpr, 0, 0);
  }
  _skyBuildBgStars();
  _skyDrawBg();
}

function _skyBuildBgStars() {
  _skyBgStars = [];
  const count = Math.floor(_skyW * _skyH / 600);
  for (let i = 0; i < count; i++) {
    _skyBgStars.push({
      x: Math.random() * _skyW, y: Math.random() * _skyH,
      r: Math.random() < 0.92 ? 0.35 + Math.random() * 0.6 : 0.8 + Math.random() * 1.2,
      bright: 0.2 + Math.random() * 0.8,
      phase: Math.random() * Math.PI * 2,
      speed: 0.3 + Math.random() * 1.2,
      hue: Math.random() < 0.6 ? 210 : Math.random() < 0.5 ? 280 : Math.random() < 0.5 ? 60 : 0,
    });
  }
}

function _skyDrawBg() {
  const ctx = _skyEl('sky-bg').getContext('2d');
  ctx.clearRect(0, 0, _skyW, _skyH);
  const cs = getComputedStyle(document.documentElement);
  const grad = ctx.createRadialGradient(_skyW*.5, _skyH*.4, 0, _skyW*.5, _skyH*.4, _skyW*.8);
  grad.addColorStop(0, cs.getPropertyValue('--sky-bg').trim() || '#110810');
  grad.addColorStop(0.4, '#080406');
  grad.addColorStop(1, '#040203');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, _skyW, _skyH);
  const mw = ctx.createLinearGradient(0, _skyH*.25, _skyW, _skyH*.75);
  mw.addColorStop(0, 'transparent');
  mw.addColorStop(0.3, 'rgba(200,90,150,0.04)');
  mw.addColorStop(0.5, 'rgba(130,60,160,0.07)');
  mw.addColorStop(0.7, 'rgba(200,90,150,0.04)');
  mw.addColorStop(1, 'transparent');
  ctx.fillStyle = mw; ctx.fillRect(0, 0, _skyW, _skyH);
  _skyBgStars.forEach(s => {
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fillStyle = `hsla(${s.hue},40%,90%,${s.bright * 0.45})`; ctx.fill();
  });
}

function _starGlow(ctx, cx, cy, r, hue, sat, lit, alpha, spike=false) {
  const g1 = ctx.createRadialGradient(cx, cy, 0, cx, cy, r*4.5);
  g1.addColorStop(0, `hsla(${hue},${sat}%,${lit}%,${alpha*0.25})`);
  g1.addColorStop(1, 'transparent');
  ctx.fillStyle = g1; ctx.beginPath(); ctx.arc(cx, cy, r*4.5, 0, Math.PI*2); ctx.fill();
  const g2 = ctx.createRadialGradient(cx, cy, 0, cx, cy, r*1.6);
  g2.addColorStop(0, `hsla(${hue},20%,98%,${alpha})`);
  g2.addColorStop(0.4, `hsla(${hue},${sat}%,${lit+10}%,${alpha*0.8})`);
  g2.addColorStop(1, `hsla(${hue},${sat}%,${lit}%,0)`);
  ctx.fillStyle = g2; ctx.beginPath(); ctx.arc(cx, cy, r*1.6, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx, cy, r*0.35, 0, Math.PI*2);
  ctx.fillStyle = `rgba(255,252,245,${alpha})`; ctx.fill();
  if (spike) {
    ctx.save(); ctx.globalAlpha = alpha * 0.2;
    ctx.strokeStyle = `hsla(${hue},40%,90%,1)`; ctx.lineWidth = 0.5;
    const len = r * 7;
    ctx.beginPath(); ctx.moveTo(cx-len, cy); ctx.lineTo(cx+len, cy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx, cy-len); ctx.lineTo(cx, cy+len); ctx.stroke();
    ctx.restore();
  }
}

function _skyGetHue(conId, fallback) {
  const cs = getComputedStyle(document.documentElement);

  const v = cs.getPropertyValue(map[conId] || '').trim();

}

    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fillStyle = `hsla(${s.hue},40%,90%,${s.bright*tw})`; ctx.fill();
  });
  SKY_CONSTELLATIONS.forEach(con => {

    const c = { ...con.color, h };
    const isH = _skyHoveredConst === con;
    con.lines.forEach(([a, b]) => {
      const s1=con.stars[a], s2=con.stars[b];
      ctx.beginPath(); ctx.moveTo(_skyPx(s1.x),_skyPy(s1.y)); ctx.lineTo(_skyPx(s2.x),_skyPy(s2.y));
      ctx.strokeStyle = `hsla(${h},50%,70%,${isH?0.38:0.13})`;
      ctx.lineWidth = isH?0.8:0.4; ctx.setLineDash([3,6]); ctx.stroke(); ctx.setLineDash([]);
    });
    con.stars.forEach((s,i) => {
      const tw = 0.6+0.4*Math.sin(_skyT*(0.5+i*.13)+s.x*10+s.y*7);
      _starGlow(ctx, _skyPx(s.x),_skyPy(s.y), isH?3.2:2.2, h,c.s,c.l, tw*(isH?1:0.8), i===0);
    });
    const lx=_skyPx(con.cx), ly=_skyPy(con.cy);
    ctx.save(); ctx.font='italic 11px Georgia'; ctx.textAlign='center';
    ctx.fillStyle=`hsla(${h},40%,80%,0.4)`; ctx.fillText(con.label,lx,ly-28);
    ctx.font='10px Georgia'; ctx.fillStyle=`hsla(${h},30%,70%,0.22)`; ctx.fillText(con.sublabel,lx,ly-16);
    if (isH) {
      ctx.font='500 13px Georgia'; ctx.fillStyle=`hsla(${h},60%,88%,0.95)`;
      ctx.shadowColor=`hsla(${h},80%,70%,0.6)`; ctx.shadowBlur=14;
      ctx.fillText(con.label,lx,ly-32);
    }
    ctx.restore();
    con._hx=lx; con._hy=ly;
  });
}

function _skyDrawSkyStateStatic(ctx) {
  SKY_CONSTELLATIONS.forEach(con => {
    const h = _skyGetHue(con.id, con.color.h);
    con.lines.forEach(([a,b]) => {
      const s1=con.stars[a], s2=con.stars[b];
      ctx.beginPath(); ctx.moveTo(_skyPx(s1.x),_skyPy(s1.y)); ctx.lineTo(_skyPx(s2.x),_skyPy(s2.y));
      ctx.strokeStyle=`hsla(${h},50%,70%,0.1)`; ctx.lineWidth=0.4;
      ctx.setLineDash([3,6]); ctx.stroke(); ctx.setLineDash([]);
    });
    con.stars.forEach(s => _starGlow(ctx,_skyPx(s.x),_skyPy(s.y),2,h,con.color.s,con.color.l,0.5,false));
  });
}

function _skyHitConstellation(mx, my) {
  for (const con of SKY_CONSTELLATIONS) {
    if (con.stars.some(s => Math.hypot(mx-_skyPx(s.x), my-_skyPy(s.y)) < 18)) return con;
  }
  return null;
}

function _skyYearToX(year) {
  const padL = _skyW*SKY_PAD_LEFT_RATIO, padR = _skyW*SKY_PAD_RIGHT_RATIO;
  return padL + ((year-SKY_YEAR_MIN)/(SKY_YEAR_MAX-SKY_YEAR_MIN))*(_skyW-padL-padR);
}

function _skyBuildTimelineNodes(con) {
  const books = con.bookIds.map(id => SKY_BOOKS.find(b=>b.id===id)).filter(Boolean);
  books.sort((a,b) => a.year - b.year);
  const axisY = _skyH * SKY_AXIS_Y_RATIO;
  return books.map((book,i) => {
    const above = i%2===0;
    const stemLen = 40 + (Math.floor(i/2)%3)*20;
    return { book, x:_skyYearToX(book.year), y:axisY+(above?-(SKY_NODE_R+stemLen):(SKY_NODE_R+stemLen)),
             axisY, stemLen, above, r:SKY_NODE_R, img:null, imgLoaded:false, _r:SKY_NODE_R };
  });
}

function _skyEase(p) { return p<0.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2; }

function _skyDrawNode(ctx, n, x, y, alpha, isH, c) {
  const r = n.r*(isH?1.15:1);
  ctx.save(); ctx.globalAlpha=alpha;
  const grd=ctx.createRadialGradient(x,y,r*.8,x,y,r*2);
  grd.addColorStop(0,`hsla(${c.h},60%,70%,${isH?.4:.2})`); grd.addColorStop(1,'transparent');
  ctx.fillStyle=grd; ctx.beginPath(); ctx.arc(x,y,r*2,0,Math.PI*2); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.clip();
  if (n.img && n.imgLoaded) {
    ctx.drawImage(n.img,x-r,y-r,r*2,r*2);
  } else {
    const cover = n.book.cover||'#7b4fa6';
    const cg=ctx.createRadialGradient(x-r*.3,y-r*.3,0,x,y,r*1.2);
    cg.addColorStop(0,cover+'ee'); cg.addColorStop(1,cover+'55');
    ctx.fillStyle=cg; ctx.fillRect(x-r,y-r,r*2,r*2);
    const init=n.book.title.split(' ').slice(0,2).map(w=>w[0]).join('');
    ctx.fillStyle='rgba(245,224,238,0.92)'; ctx.font=`${r*.45}px Georgia`;
    ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(init,x,y);
    ctx.textBaseline='alphabetic';
  }
  ctx.restore();
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
  ctx.strokeStyle=isH?`hsla(${c.h},80%,88%,1)`:`hsla(${c.h},50%,70%,${alpha*.5})`;
  ctx.lineWidth=isH?1.5:0.5; ctx.stroke();
  ctx.restore();
  n._r=r;
}

function _skyDrawBurst(progress) {
  const ctx = _skyEl('sky-main').getContext('2d');
  ctx.clearRect(0,0,_skyW,_skyH);
  ctx.globalAlpha=Math.max(0,1-progress*1.5);
  _skyDrawSkyStateStatic(ctx);
  ctx.globalAlpha=1;
  if (!_skyActiveConst) return;
  const c={...(_skyActiveConst.color), h:_skyGetHue(_skyActiveConst.id,_skyActiveConst.color.h)};
  const cx=_skyPx(_skyActiveConst.cx), cy=_skyPy(_skyActiveConst.cy);
  if (progress<0.4) {
    const ring=progress/0.4;
    ctx.beginPath(); ctx.arc(cx,cy,ring*Math.min(_skyW,_skyH)*.35,0,Math.PI*2);
    ctx.strokeStyle=`hsla(${c.h},70%,80%,${(1-ring)*.5})`; ctx.lineWidth=1; ctx.stroke();
  }
  _skyBookNodes.forEach((n,i) => {
    const delay=(i/_skyBookNodes.length)*.25;
    const p=Math.max(0,Math.min(1,(progress-delay)/(1-delay)));
    const ep=_skyEase(p);
    const nx=cx+(n.x-cx)*ep, ny=cy+(n.y-cy)*ep;
    _skyDrawNode(ctx,n,nx,ny,Math.min(1,p*3),false,c);
  });
}

function _skyDrawTimeline() {
  const ctx = _skyEl('sky-main').getContext('2d');
  ctx.clearRect(0,0,_skyW,_skyH);
  if (!_skyActiveConst) return;
  const c={...(_skyActiveConst.color), h:_skyGetHue(_skyActiveConst.id,_skyActiveConst.color.h)};
  const axisY=_skyH*SKY_AXIS_Y_RATIO;
  ctx.save(); ctx.translate(_skyPanX,0); ctx.scale(_skyZoom,_skyZoom);
  // Axis line
  ctx.beginPath(); ctx.moveTo(_skyYearToX(SKY_YEAR_MIN),axisY); ctx.lineTo(_skyYearToX(SKY_YEAR_MAX),axisY);
  ctx.strokeStyle=`hsla(${c.h},40%,60%,0.35)`; ctx.lineWidth=0.5/_skyZoom; ctx.stroke();
  // Era markers
  SKY_ERA_MARKERS.forEach(yr => {
    const mx=_skyYearToX(yr);
    ctx.beginPath(); ctx.arc(mx,axisY,2.5/_skyZoom,0,Math.PI*2);
    ctx.fillStyle=`hsla(${c.h},40%,70%,0.5)`; ctx.fill();
    const lbl=yr<0?`${Math.abs(yr)} BCE`:yr===0?'0':String(yr);
    ctx.font=`${9/_skyZoom}px Georgia`; ctx.fillStyle=`hsla(${c.h},30%,80%,0.65)`; ctx.textAlign='center';
    ctx.fillText(lbl,mx,axisY+16/_skyZoom);
  });
  // Book nodes
  _skyBookNodes.forEach((n,i) => {
    const isH=_skyHoveredBook===i;
    ctx.beginPath(); ctx.moveTo(n.x,axisY); ctx.lineTo(n.x,n.y+(n.above?n.r:-n.r));
    ctx.strokeStyle=`hsla(${c.h},40%,60%,${isH?.6:.25})`; ctx.lineWidth=0.5/_skyZoom;
    ctx.setLineDash([2/_skyZoom,4/_skyZoom]); ctx.stroke(); ctx.setLineDash([]);
    ctx.beginPath(); ctx.arc(n.x,axisY,2.5/_skyZoom,0,Math.PI*2);
    ctx.fillStyle=`hsla(${c.h},50%,70%,${isH?.9:.5})`; ctx.fill();
    _skyDrawNode(ctx,n,n.x,n.y,1,isH,c);
    if (isH) {
      const words=n.book.title.split(' ');
      const line1=words.slice(0,2).join(' '), line2=words.slice(2).join(' ');
      ctx.fillStyle='rgba(235,218,245,0.95)';
      ctx.font=`${11/_skyZoom}px Georgia`; ctx.textAlign='center';
      const lby=n.above?n.y-n.r-18/_skyZoom:n.y+n.r+18/_skyZoom;
      ctx.fillText(line1,n.x,lby);
      if (line2) ctx.fillText(line2,n.x,n.above?lby-13/_skyZoom:lby+13/_skyZoom);
    }
  });
  ctx.restore();
}

// ── Sky loop + event handlers ─────────────────────────────────────────────────

function _skyLoop() {
  if (_skyState==='sky') {
    _skyDrawSkyState();
  } else if (_skyState==='burst') {
    if (_skyBurstReverse) {
      _skyBurstProgress=Math.max(0,_skyBurstProgress-0.018);
      _skyDrawBurst(_skyBurstProgress);
      if (_skyBurstProgress<=0) { _skyEl('sky-overlay').classList.remove('active'); cancelAnimationFrame(_skyFrame); return; }
    } else {
      _skyBurstProgress=Math.min(1,_skyBurstProgress+0.018);
      _skyDrawBurst(_skyBurstProgress);
      if (_skyBurstProgress>=1) {
        _skyState='timeline';
        _skyEl('sky-back-btn').style.display='block';
        _skyEl('sky-recenter-btn').style.display='block';
      }
    }
  } else if (_skyState==='timeline') {
    _skyZoom +=(_skyTargetZoom-_skyZoom)*.12;
    _skyPanX +=(_skyTargetPanX-_skyPanX)*.12;
    _skyDrawTimeline();
  }
  _skyT+=0.016;
  _skyFrame=requestAnimationFrame(_skyLoop);
}

function _skyGoBack() {
  if (_skyState!=='timeline') return;
  _skyState='sky'; _skyActiveConst=null; _skyHoveredBook=null;
  _skyTargetZoom=1; _skyTargetPanX=0;
  _skyEl('sky-back-btn').style.display='none';
  _skyEl('sky-recenter-btn').style.display='none';
  _skyEl('sky-tooltip').style.display='none';
}

function _skyOpenHoveredBook() {
  if (_skyHoveredBook===null) return;
  const n=_skyBookNodes[_skyHoveredBook];
  if (n) window.location.href=`index.html?id=${encodeURIComponent(n.book.id)}`;
}

function _skyOnMouseMove(e) {
  const rect=_skyEl('sky-main').getBoundingClientRect();
  const mx=e.clientX-rect.left, my=e.clientY-rect.top;
  _skyEl('sky-tooltip').style.display='none';
  if (_skyState==='sky') {
    _skyHoveredConst=_skyHitConstellation(mx,my);
    _skyEl('sky-main').style.cursor=_skyHoveredConst?'pointer':'default';
  } else if (_skyState==='timeline') {
    const worldX=(mx-_skyPanX)/_skyZoom, worldY=my/_skyZoom;
    _skyHoveredBook=null;
    _skyBookNodes.forEach((n,i) => { if (Math.hypot(worldX-n.x,worldY-n.y)<(n._r||n.r)+4) _skyHoveredBook=i; });
    if (_skyHoveredBook!==null) {
      _skyEl('sky-main').style.cursor='pointer';
      const n=_skyBookNodes[_skyHoveredBook];
      document.getElementById('sky-tt-title').textContent=n.book.title;
      document.getElementById('sky-tt-meta').textContent=`${n.book.author} · ${n.book.year<0?Math.abs(n.book.year)+' BCE':n.book.year}`;
      document.getElementById('sky-tt-desc').textContent=n.book.summary||'';
      let tx=(n.x*_skyZoom+_skyPanX)+n.r*_skyZoom+12, ty=n.y*_skyZoom-20;
      if (tx+260>_skyW) tx=(n.x*_skyZoom+_skyPanX)-n.r*_skyZoom-260;
      const tt=_skyEl('sky-tooltip');
      tt.style.left=tx+'px'; tt.style.top=Math.max(8,ty)+'px'; tt.style.display='block';
    } else { _skyEl('sky-main').style.cursor='default'; }
  }
}

function _skyOnClick(e) {
  if (_skyState==='sky'&&_skyHoveredConst) {
    _skyActiveConst=_skyHoveredConst;
    _skyBookNodes=_skyBuildTimelineNodes(_skyActiveConst);
    _skyBookNodes.forEach(n => {
      if (n.book.cover?.startsWith('data:')||n.book.cover?.startsWith('http')) {
        const img=new Image(); img.src=n.book.cover;
        img.onload=()=>{ n.img=img; n.imgLoaded=true; };
      }
    });
    _skyBurstProgress=0; _skyBurstReverse=false; _skyState='burst';
    _skyEl('sky-tooltip').style.display='none';
  }
}

function _skyOnDblClick() {
  if (_skyState==='timeline'&&_skyHoveredBook!==null) _skyOpenHoveredBook();
}

function _skyOnWheel(e) {
  if (_skyState!=='timeline') return;
  e.preventDefault();
  const rect=_skyEl('sky-main').getBoundingClientRect();
  const mx=e.clientX-rect.left;
  const worldX=(mx-_skyPanX)/_skyZoom;
  const delta=e.deltaY>0?-0.1:0.1;
  _skyTargetZoom=Math.max(SKY_ZOOM_MIN,Math.min(SKY_ZOOM_MAX,_skyTargetZoom+delta));
  const panLimit=(_skyTargetZoom-1)*_skyW*.6;
  _skyTargetPanX=Math.max(-panLimit,Math.min(panLimit,mx-worldX*_skyTargetZoom));
}

function _skyAutoAssignConstellations(bookId, bookData) {
  SKY_CONSTELLATIONS.forEach(con => {
    if (con.bookIds.includes(bookId)) return;
    if (con.id==='eras'&&bookData.year!==undefined) con.bookIds.push(bookId);
    if (con.id==='regions'&&bookData.region) con.bookIds.push(bookId);
    if (con.id==='themes'&&bookData.theme) con.bookIds.push(bookId);
  });
}

async function initSkyLibrary() {
  const idbBooks = await getAllBooks();
  idbBooks.forEach(entry => {
    if (!SKY_BOOKS.find(b=>b.id===entry.id)) {
      const bk=entry.bundle?.book||{};
      SKY_BOOKS.push({ id:entry.id, title:entry.title||'Untitled', author:entry.author||'',
        year:bk.year||1900, region:bk.region||'', theme:bk.theme||'',
        summary:bk.summary||'', cover:bk.cover||'#7b4fa6' });
    }
    const saved=entry.bundle?.constellations;
    if (saved) {
      SKY_CONSTELLATIONS.forEach(con => {
        const shouldBe=saved[con.id]??false;
        const idx=con.bookIds.indexOf(entry.id);
        if (shouldBe&&idx===-1) con.bookIds.push(entry.id);
        if (!shouldBe&&idx!==-1) con.bookIds.splice(idx,1);
      });
    } else {
      _skyAutoAssignConstellations(entry.id, entry.bundle?.book||{});
    }
  });
  // Preload cover images for all books
  SKY_BOOKS.forEach(b => {
    if (b.cover?.startsWith('data:')||b.cover?.startsWith('http')) {
      const img=new Image(); img.src=b.cover;
      img.onload=()=>{ b._img=img; b._imgLoaded=true; };
    }
  });
  _skyEl('sky-overlay').classList.add('active');
  skyResize();
  _skyLoop();
  _skyEl('sky-back-btn').addEventListener('click', _skyGoBack);
  _skyEl('sky-recenter-btn').addEventListener('click', ()=>{ _skyTargetZoom=1; _skyTargetPanX=0; });
  _skyEl('sky-tt-open').addEventListener('click', _skyOpenHoveredBook);
  _skyEl('sky-main').addEventListener('mousemove', _skyOnMouseMove);
  _skyEl('sky-main').addEventListener('click', _skyOnClick);
  _skyEl('sky-main').addEventListener('dblclick', _skyOnDblClick);
  _skyEl('sky-main').addEventListener('wheel', _skyOnWheel, { passive:false });
  window.addEventListener('resize', skyResize);
}

function closeSky(animated=true) {
  if (!animated) { _skyEl('sky-overlay').classList.remove('active'); cancelAnimationFrame(_skyFrame); return; }
  _skyBurstReverse=true; _skyBurstProgress=1; _skyState='burst';
}

const TOOLBAR_LS_KEY = 'isabelle-v2-toolbar-config';

const TOOLBAR_DEFAULTS = [
  { id:'btn-play',           icon:'▶',  label:'Play',           size:'md', visible:true },
  { id:'btn-stop',           icon:'◼',  label:'Stop',           size:'md', visible:true },
  { id:'btn-prev',           icon:'←',  label:'Previous',       size:'md', visible:true },
  { id:'btn-next',           icon:'→',  label:'Next',           size:'md', visible:true },
  { id:'btn-narrator',       icon:'♪',  label:'Narrator',       size:'md', visible:true },
  { id:'btn-range-copy',     icon:'✂',  label:'Range copy',     size:'md', visible:true },
  { id:'btn-font-dec',       icon:'A-', label:'Smaller text',   size:'sm', visible:true },
  { id:'btn-font-inc',       icon:'A+', label:'Larger text',    size:'sm', visible:true },
  { id:'btn-theme',          icon:'◐',  label:'Theme',          size:'md', visible:true },
  { id:'btn-focus',          icon:'⊞',  label:'Reading mode',   size:'md', visible:true },
  { id:'btn-context',        icon:'📖', label:'Context',        size:'md', visible:true },
  { id:'btn-sidebar',        icon:'≡',  label:'Navigation',     size:'md', visible:true },
  { id:'btn-sky-library',    icon:'⌂',  label:'Library',        size:'md', visible:true },
  { id:'btn-bookshelf',      icon:'📚', label:'Bookshelf',      size:'md', visible:true },
  { id:'btn-export',         icon:'↓',  label:'Export',         size:'md', visible:true },
  { id:'btn-smart',          icon:'✦',  label:'Smart features', size:'md', visible:true },
  { id:'btn-save',           icon:'↓',  label:'Save bundle',    size:'md', visible:true },
  { id:'btn-studio',         icon:'✎',  label:'Studio',         size:'md', visible:true },
  { id:'btn-toolbar-edit',   icon:'⚙',  label:'Edit toolbar',   size:'md', visible:true },
  { id:'btn-bottom-collapse',icon:'▽',  label:'Hide bar',       size:'sm', visible:true },
];

function toolbarLoadConfig() {
  try {
    const raw=localStorage.getItem(TOOLBAR_LS_KEY);
    if (!raw) return JSON.parse(JSON.stringify(TOOLBAR_DEFAULTS));
    const saved=JSON.parse(raw);
    const savedIds=new Set(saved.map(e=>e.id));
    const merged=[...saved];
    TOOLBAR_DEFAULTS.forEach(d=>{ if (!savedIds.has(d.id)) merged.push({...d}); });
    return merged;
  } catch { return JSON.parse(JSON.stringify(TOOLBAR_DEFAULTS)); }
}

function toolbarSaveConfig(config) { localStorage.setItem(TOOLBAR_LS_KEY, JSON.stringify(config)); }

function toolbarApplyConfig(config) {
  const row=document.getElementById('bar-row-1');
  config.forEach(entry => {
    const el=document.getElementById(entry.id);
    if (!el||!el.classList.contains('bar-icon')) return;
    el.style.display=entry.visible?'':'none';
    el.classList.toggle('bar-icon-sm', entry.size==='sm');
    el.classList.toggle('bar-icon-lg', entry.size==='lg');
    row.appendChild(el);
  });
}

let _toolbarDragId=null;

function _toolbarInitDrag() {
  const row=document.getElementById('bar-row-1');
  row.addEventListener('dragstart', e=>{
    const btn=e.target.closest('.bar-icon');
    if (!btn||!document.body.classList.contains('toolbar-edit-mode')){ e.preventDefault(); return; }
    _toolbarDragId=btn.id; btn.style.opacity='0.4';
  });
  row.addEventListener('dragend', e=>{
    const btn=e.target.closest('.bar-icon');
    if (btn) btn.style.opacity='';
    row.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over'));
  });
  row.addEventListener('dragover', e=>{
    e.preventDefault();
    const btn=e.target.closest('.bar-icon');
    if (!btn||btn.id===_toolbarDragId) return;
    row.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over'));
    btn.classList.add('drag-over');
  });
  row.addEventListener('drop', e=>{
    e.preventDefault();
    const target=e.target.closest('.bar-icon');
    if (!target||!_toolbarDragId||target.id===_toolbarDragId) return;
    const config=toolbarLoadConfig();
    const fromIdx=config.findIndex(c=>c.id===_toolbarDragId);
    const toIdx=config.findIndex(c=>c.id===target.id);
    if (fromIdx===-1||toIdx===-1) return;
    const [moved]=config.splice(fromIdx,1);
    config.splice(toIdx,0,moved);
    toolbarSaveConfig(config); toolbarApplyConfig(config);
  });
  row.querySelectorAll('.bar-icon').forEach(btn=>btn.setAttribute('draggable','true'));
}

function _toolbarShowIconMenu(btn, config, entry) {
  document.getElementById('toolbar-icon-menu')?.remove();
  const menu=document.createElement('div');
  menu.id='toolbar-icon-menu';
  menu.style.cssText='position:fixed;z-index:200;background:var(--surf);border:1px solid var(--border);padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:160px';
  const rect=btn.getBoundingClientRect();
  menu.style.left=rect.left+'px'; menu.style.bottom=(window.innerHeight-rect.top+4)+'px';
  const sizeRow=document.createElement('div'); sizeRow.style.cssText='display:flex;gap:4px;';
  ['sm','md','lg'].forEach(sz=>{
    const b=document.createElement('button'); b.textContent=sz; b.className='bar-text-btn';
    if (entry.size===sz) b.style.borderColor='var(--accent)';
    b.onclick=()=>{ entry.size=sz; toolbarSaveConfig(config); toolbarApplyConfig(config); menu.remove(); };
    sizeRow.appendChild(b);
  });
  menu.appendChild(sizeRow);
  const iconRow=document.createElement('div'); iconRow.style.cssText='display:flex;gap:4px;align-items:center;';
  const inp=document.createElement('input');
  inp.value=entry.icon;
  inp.style.cssText='background:var(--surf2);border:none;color:var(--text);font-size:1rem;width:48px;text-align:center;padding:3px;';
  inp.onchange=()=>{ entry.icon=inp.value; btn.textContent=inp.value; toolbarSaveConfig(config); };
  iconRow.appendChild(inp); menu.appendChild(iconRow);
  const visBtn=document.createElement('button'); visBtn.textContent=entry.visible?'Hide':'Show'; visBtn.className='bar-text-btn';
  visBtn.onclick=()=>{ entry.visible=!entry.visible; toolbarSaveConfig(config); toolbarApplyConfig(config); menu.remove(); };
  menu.appendChild(visBtn);
  document.body.appendChild(menu);
  setTimeout(()=>document.addEventListener('click',()=>menu.remove(),{once:true}),0);
}

function initToolbar() {
  const config=toolbarLoadConfig();
  toolbarApplyConfig(config);
  _toolbarInitDrag();
  document.getElementById('btn-toolbar-edit').addEventListener('click',()=>{
    document.body.classList.toggle('toolbar-edit-mode');
    document.getElementById('btn-toolbar-edit').classList.toggle('toolbar-edit-btn');
  });
  document.getElementById('bar-row-1').addEventListener('contextmenu',e=>{
    if (!document.body.classList.contains('toolbar-edit-mode')) return;
    const btn=e.target.closest('.bar-icon');
    if (!btn) return;
    e.preventDefault();
    const config=toolbarLoadConfig();
    const entry=config.find(c=>c.id===btn.id);
    if (!entry) return;
    _toolbarShowIconMenu(btn,config,entry);
  });
}

function openStudio(section='books') {
