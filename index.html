<!DOCTYPE html>
<html lang="en" data-theme="dark" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="google" content="notranslate">
  <title>Isabelle — Letters</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --sidebar-w:260px; --context-w:320px;
      --bg:#09060c; --surf:#0f0a13; --surf2:#140e18;
      --border:rgba(198,123,165,0.14); --border-hi:rgba(198,123,165,0.38);
      --accent:#c67ba5; --accent-bg:rgba(198,123,165,0.10); --accent-dim:rgba(198,123,165,0.28);
      --text:rgba(255,255,255,0.82); --text-m:rgba(255,255,255,0.52); --text-d:rgba(255,255,255,0.28);
      --book-font:Georgia,'Times New Roman',serif;
      --ui-font:'JetBrains Mono',monospace;
      --font-size:16px; --t:0.18s ease;
    }
    [data-theme="light"] {
      --bg:#faf8f5; --surf:#f0ede8; --surf2:#e8e4de;
      --border:rgba(120,60,90,0.14); --border-hi:rgba(120,60,90,0.30);
      --accent:#9b4f7a; --text:rgba(30,20,25,0.85); --text-m:rgba(30,20,25,0.55); --text-d:rgba(30,20,25,0.35);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{font-size:var(--font-size)}
    :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

    body{background:var(--bg);color:var(--text);font-family:var(--ui-font);height:100vh;display:flex;flex-direction:column;overflow:hidden}
    #app{display:flex;flex:1;overflow:hidden;min-width:0}

    #sidebar-reveal{width:0;flex-shrink:0;align-self:stretch;cursor:pointer;background:linear-gradient(90deg,var(--accent-dim),var(--accent));opacity:0;pointer-events:none;transition:width var(--t),opacity var(--t)}
    @media(min-width:768px){
      #app:has(#sidebar.collapsed) #sidebar-reveal{width:10px;opacity:.55;pointer-events:auto}
      #app:has(#sidebar.collapsed) #sidebar-reveal:hover{opacity:1}
    }
    #sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);max-width:min(520px,45vw);background:var(--surf);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:width var(--t),min-width var(--t),border-color var(--t),opacity var(--t);overflow:hidden;flex-shrink:0;opacity:var(--panel-opacity,1)}
    #sidebar.collapsed{width:0!important;min-width:0!important;max-width:0!important;border-right-color:transparent}
    .sidebar-head{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px 8px;border-bottom:1px solid var(--border)}
    .sidebar-head-title{font-family:var(--ui-font);font-size:.56rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
    .sidebar-collapse-btn{background:none;border:none;color:var(--text-m);cursor:pointer;font-size:1rem;line-height:1;padding:4px 6px;border-radius:4px;transition:color var(--t),background var(--t)}
    .sidebar-collapse-btn:hover{color:var(--accent);background:var(--accent-bg)}
    @media(max-width:767px){
      #sidebar.collapsed{width:min(320px,85vw)!important;min-width:min(320px,85vw)!important;max-width:85vw!important}
    }
    #sidebar-nav{flex:1;overflow-y:auto;padding:12px 0;scrollbar-width:thin;scrollbar-color:var(--border) transparent}

    .resize-gutter{width:5px;flex-shrink:0;cursor:col-resize;background:transparent;position:relative;touch-action:none}
    .resize-gutter::after{content:'';position:absolute;inset:0 auto 0 50%;width:1px;margin-left:-1px;background:var(--border);transition:background var(--t),box-shadow var(--t)}
    .resize-gutter:hover::after,.resize-gutter:focus-visible::after{background:var(--accent);box-shadow:0 0 0 1px var(--accent-dim)}
    #sidebar.collapsed + .resize-gutter{display:none}
    #main:has(#context-pane.collapsed) #gutter-context{display:none}
    .nav-letter{display:block;width:100%;background:none;border:none;text-align:left;padding:6px 16px;color:var(--text-m);font-family:var(--book-font);font-size:.82rem;cursor:pointer;transition:color var(--t),background var(--t)}
    .nav-letter:hover,.nav-letter.active{color:var(--text);background:var(--surf2)}
    .nav-letter.placeholder{opacity:.4;cursor:default}
    .nav-chapter-heading{font-family:var(--ui-font);font-size:.56rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);padding:16px 16px 6px}

    #main{flex:1;display:flex;overflow:hidden;min-width:0}
    #letter-pane{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;min-width:120px}
    #letter-content{flex:1;overflow-y:auto;padding:48px 60px 40px;scrollbar-width:thin;scrollbar-color:var(--border-hi) transparent}

    #context-pane{width:var(--context-w);min-width:var(--context-w);max-width:min(560px,50vw);background:var(--surf);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;transition:width var(--t),min-width var(--t),max-width var(--t),border-color var(--t),opacity var(--t);flex-shrink:0;opacity:var(--panel-opacity,1)}
    #context-pane.collapsed{width:0!important;min-width:0!important;max-width:0!important;border-left-color:transparent}
    #context-content{flex:1;overflow-y:auto;padding:24px 20px;scrollbar-width:thin;scrollbar-color:var(--border-hi) transparent}

    #letter-content::-webkit-scrollbar,#sidebar-nav::-webkit-scrollbar,#context-content::-webkit-scrollbar{width:6px;height:6px}
    #letter-content::-webkit-scrollbar-thumb,#sidebar-nav::-webkit-scrollbar-thumb,#context-content::-webkit-scrollbar-thumb{background:var(--border-hi);border-radius:3px}
    #letter-content::-webkit-scrollbar-track,#sidebar-nav::-webkit-scrollbar-track,#context-content::-webkit-scrollbar-track{background:transparent}

    #narrator-line{position:absolute;top:0;left:0;height:2px;width:0;background:var(--accent);transition:width .3s linear;display:none}

    .letter-meta{display:flex;justify-content:space-between;font-size:.72rem;color:var(--text-d);margin-bottom:24px;font-family:var(--ui-font);letter-spacing:.06em}
    .view-switcher{display:flex;gap:20px;margin-bottom:28px;flex-wrap:wrap}
    .view-switcher [role=tab]{background:none;border:none;font-family:var(--ui-font);font-size:.68rem;color:var(--text-d);cursor:pointer;padding:0 0 3px;transition:color var(--t)}
    .view-switcher [role=tab].active{color:var(--accent);border-bottom:1px solid var(--accent)}
    /* ── Per-view tab label typography ──────────────────────────── */
    .view-switcher [data-view="original_french"]        {font-family:var(--book-font);font-style:italic;font-size:.72rem}
    .view-switcher [data-view="modern_french"]          {font-family:var(--book-font);font-size:.72rem}
    .view-switcher [data-view="literal_english_old"]    {font-family:var(--ui-font);letter-spacing:.05em;font-size:.6rem}
    .view-switcher [data-view="literal_english_modern"] {font-family:var(--ui-font);letter-spacing:.02em;font-size:.62rem}
    .view-switcher [data-view="plain_english"]          {font-family:var(--ui-font);font-size:.68rem}
    .view-switcher [data-view="handwriting_style"]      {font-family:'Pinyon Script',cursive;font-size:1.05rem;letter-spacing:.02em;padding-bottom:0}
    .view-switcher [data-view="photocopy"]              {font-family:var(--book-font);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase}
    /* ── Per-view body typography ────────────────────────────────── */
    .letter-body[data-view="original_french"] .letter-paragraph,
    .letter-body[data-view="original_french"] .letter-salutation,
    .letter-body[data-view="original_french"] .letter-closing  {font-style:italic;letter-spacing:.01em}
    .letter-body[data-view="modern_french"] .letter-paragraph,
    .letter-body[data-view="modern_french"] .letter-salutation,
    .letter-body[data-view="modern_french"] .letter-closing    {font-style:italic}
    .letter-body[data-view="literal_english_old"] .letter-paragraph,
    .letter-body[data-view="literal_english_old"] .letter-salutation,
    .letter-body[data-view="literal_english_old"] .letter-closing {font-family:var(--ui-font);font-size:.84rem;line-height:1.95;letter-spacing:.01em}
    .letter-body[data-view="literal_english_modern"] .letter-paragraph,
    .letter-body[data-view="literal_english_modern"] .letter-salutation,
    .letter-body[data-view="literal_english_modern"] .letter-closing {font-family:var(--ui-font);font-size:.86rem;line-height:1.9}
    .letter-salutation{font-family:var(--book-font);font-size:var(--font-size);color:var(--text);margin-bottom:16px;font-style:italic}
    .letter-paragraph{font-family:var(--book-font);font-size:var(--font-size);color:var(--text);line-height:1.82;margin-bottom:14px;max-width:640px}
    .letter-paragraph.current{background:var(--accent-bg)}
    .letter-paragraph.handwriting{font-family:'Pinyon Script',cursive;font-size:calc(var(--font-size) * 1.3);background:rgba(245,240,230,0.06);padding:4px 8px}
    .letter-closing{font-family:var(--book-font);font-size:var(--font-size);color:var(--text);text-align:right;margin-top:20px;font-style:italic;max-width:640px}
    .ctx-ref{border-bottom:1px dotted var(--accent);cursor:pointer}
    .ctx-ref:hover{background:var(--accent-bg)}
    .letter-nav{display:flex;justify-content:space-between;margin-top:32px;padding-top:20px;border-top:1px solid var(--border);max-width:640px}
    .letter-nav button{background:none;border:none;color:var(--text-d);font-family:var(--ui-font);font-size:.72rem;cursor:pointer;transition:color var(--t)}
    .letter-nav button:hover:not(:disabled){color:var(--accent)}
    .letter-nav button:disabled{opacity:.25;cursor:default}
    .photocopy-img{max-width:100%;background:rgba(245,240,230,0.04);display:block}
    .photocopy-fallback{background:rgba(245,240,230,0.04);padding:24px}
    .photocopy-notice{font-size:.72rem;color:var(--text-d);margin-bottom:16px;font-family:var(--ui-font)}
    .view-missing{color:var(--text-d);font-family:var(--ui-font);font-size:.8rem;font-style:italic}
    .guardian-flag{border-radius:2px;cursor:help;text-decoration:underline wavy}
    .guardian-header{background:rgba(255,80,80,.18);text-decoration-color:#f55}
    .guardian-folio{background:rgba(255,180,0,.18);text-decoration-color:#fb0}
    .guardian-footnote{background:rgba(80,160,255,.18);text-decoration-color:#5af}
    .guardian-marker{background:rgba(180,80,255,.18);text-decoration-color:#c6f}
    .guardian-ocr{background:rgba(255,80,80,.35);text-decoration-color:#f00;font-weight:bold}
    .guardian-banner{font-family:var(--ui-font);font-size:.72rem;color:#f90;padding:6px 10px;border-left:2px solid #f90;margin-bottom:12px;line-height:1.4}

    /* ── Book 2 track bar ────────────────────────────────────────── */
    #context-track-bar{padding:10px 12px 6px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:6px;flex-shrink:0}
    .track-row{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
    .track-override-label{font-family:var(--ui-font);font-size:.6rem;color:var(--text-d);text-transform:uppercase;letter-spacing:.04em;margin-right:2px;white-space:nowrap}
    .track-pill{font-family:var(--ui-font);font-size:.65rem;padding:3px 8px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--text-d);cursor:pointer;transition:background .15s,color .15s,border-color .15s}
    .track-pill:hover{background:var(--border);color:var(--text-m)}
    .track-pill.global-active{border-color:var(--accent);color:var(--accent)}
    .track-pill.local-active{border-color:var(--accent);background:var(--accent);color:#000}
    .track-pill-sm{font-size:.58rem;padding:2px 6px}

    /* ── Fiction visual treatment ────────────────────────────────── */
    .fiction-badge{font-family:var(--ui-font);font-size:.6rem;font-weight:700;letter-spacing:.08em;color:var(--accent);border:1px solid var(--accent);border-radius:3px;padding:1px 6px;display:inline-block;margin-bottom:6px}
    .fiction-disclaimer{font-family:var(--ui-font);font-size:.62rem;color:var(--text-d);font-style:italic;margin-bottom:14px;line-height:1.4}
    .fiction-title{font-family:var(--book-font);font-size:.82rem;font-weight:600;color:var(--text-m);margin-bottom:10px;font-style:italic}
    .fiction-paragraph{font-family:var(--book-font);font-size:.88rem;line-height:1.8;color:var(--text-m);margin-bottom:12px;font-style:italic}

    body.page-mode #letter-content{overflow:hidden;display:flex;scroll-snap-type:x mandatory}
    body.page-mode .letter-page{min-width:100%;scroll-snap-align:start;padding:48px 60px 40px}

    #bottom-bar{
      --bottom-bar-max-h:80px;
      background:var(--surf);padding:0 12px 6px;
      display:flex;flex-direction:column;gap:0;flex-shrink:0;flex-grow:0;
      min-height:0;overflow:visible;
      position:relative;z-index:150;
      opacity:var(--panel-opacity,1);
      transition:max-height .28s ease,padding var(--t),opacity .2s ease,flex-basis .28s ease
    }
    #bottom-bar.collapsed{
      flex:0 0 0;max-height:0!important;min-height:0!important;padding:0;border-top-width:0;
      overflow:hidden;opacity:0;pointer-events:none
    }
    #bottom-bar.collapsed .bar-row{max-height:0!important;min-height:0!important;overflow:hidden;padding:0;margin:0}
    .bottom-bar-resize-gutter{
      height:5px;flex-shrink:0;margin:0 -12px 4px -12px;cursor:row-resize;touch-action:none;
      background:transparent;position:relative
    }
    .bottom-bar-resize-gutter::after{
      content:'';position:absolute;left:0;right:0;top:0;height:1px;
      background:var(--border);transition:all var(--t)
    }
    .bottom-bar-resize-gutter:hover::after,.bottom-bar-resize-gutter:focus-visible::after{
      left:20%;right:20%;top:50%;height:2px;margin-top:-1px;border-radius:2px;
      background:var(--accent);box-shadow:0 0 0 1px var(--accent-dim)
    }
    #bottom-bar.collapsed .bottom-bar-resize-gutter{display:none}
    .bar-row{
      display:flex;align-items:center;gap:8px;flex-wrap:wrap;
      max-height:var(--bottom-bar-max-h);min-height:0;overflow-x:hidden;overflow-y:auto;
      flex:0 1 auto
    }
    .bar-icon{background:none;border:none;color:var(--text-m);cursor:pointer;font-size:.88rem;padding:2px 4px;transition:color var(--t),opacity var(--t);line-height:1;min-width:32px;min-height:32px;display:flex;align-items:center;justify-content:center;opacity:var(--icon-opacity,1)}
    .bar-icon.bar-collapse{margin-left:auto;font-size:.72rem;opacity:.85}
    .bar-text-btn{font-family:var(--ui-font);font-size:.58rem;letter-spacing:.04em;text-transform:uppercase;color:var(--text-m);background:var(--surf2);border:1px solid var(--border);padding:5px 10px;cursor:pointer;transition:color var(--t),border-color var(--t),background var(--t)}
    .bar-text-btn:hover{color:var(--text);border-color:var(--accent);background:var(--accent-bg)}
    .bar-icon:hover,.bar-icon.active{color:var(--accent);opacity:1}
    .speed-slider{width:80px;accent-color:var(--accent)}
    .speed-label{font-size:.68rem;color:var(--text-d);min-width:28px}
    #bottom-bar .bar-tip-speed{gap:6px}
    #bottom-bar .bar-tip,#pull-strip.bar-tip,#sidebar-reveal.bar-tip,#sidebar .sidebar-collapse-btn.bar-tip{position:relative;display:inline-flex;align-items:center;vertical-align:middle}
    #pull-strip.bar-tip,#sidebar-reveal.bar-tip{display:block}
    #bottom-bar .bar-tip-wrap-select{display:inline-flex;align-items:center;position:relative;vertical-align:middle}
    /* ── Universal tooltip ───────────────────────────────────────── */
    #app-tooltip{
      position:fixed;z-index:300;
      padding:4px 8px;max-width:min(260px,55vw);width:max-content;text-align:center;white-space:normal;
      font-family:var(--ui-font);font-size:.63rem;line-height:1.3;font-weight:500;letter-spacing:.02em;
      color:#f0e4f8;background:rgba(28,10,42,0.97);border:1px solid rgba(198,123,165,0.65);
      border-radius:5px;box-shadow:0 4px 16px rgba(0,0,0,.6);
      transform:translateX(-50%);
      opacity:0;visibility:hidden;pointer-events:none;transition:opacity .12s ease
    }
    #app-tooltip.visible{opacity:1;visibility:visible}
    #app-tooltip::after{
      content:'';position:absolute;left:50%;top:100%;transform:translateX(-50%);
      border:5px solid transparent;border-top-color:rgba(198,123,165,0.65);
    }
    .pull-strip{display:none;height:4px;background:linear-gradient(180deg,var(--accent-dim),var(--accent));cursor:pointer;opacity:.55;flex-shrink:0;transition:opacity var(--t)}
    .pull-strip:hover{opacity:1}
    #bottom-bar.collapsed ~ .pull-strip{display:block}

    #smart-features-panel{position:fixed;bottom:52px;right:20px;background:var(--surf);border:1px solid var(--border);padding:16px 20px;z-index:50;display:none;min-width:220px;max-height:70vh;overflow-y:auto}
    #smart-features-panel.open{display:block}
    .sf-row{display:flex;align-items:center;gap:10px;padding:5px 0;cursor:pointer}
    .sf-toggle{width:32px;height:18px;background:var(--surf2);border:1px solid var(--border);border-radius:9px;cursor:pointer;position:relative;transition:background var(--t)}
    .sf-toggle.on{background:var(--accent-dim)}

    #export-panel{position:fixed;bottom:52px;left:50%;transform:translateX(-50%);background:var(--surf);border:1px solid var(--border);padding:20px 24px;z-index:50;display:none;min-width:280px}
    #export-panel.open{display:block}
    .export-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
    .export-btn{background:none;border:1px solid var(--border);color:var(--text-m);font-family:var(--ui-font);font-size:.62rem;padding:5px 10px;cursor:pointer;transition:all var(--t)}
    .export-btn.active,.export-btn:hover{background:var(--accent-dim);color:var(--text);border-color:var(--accent)}

    #bookshelf-panel{position:fixed;bottom:52px;right:20px;background:var(--surf);border:1px solid var(--border);padding:20px 24px;z-index:50;display:none;min-width:300px;max-height:70vh;overflow-y:auto}
    #bookshelf-panel.open{display:block}
    .bs-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
    .bs-title{font-family:var(--ui-font);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
    .bs-add-btn{background:none;border:1px solid var(--border);color:var(--text-m);font-family:var(--ui-font);font-size:.62rem;padding:5px 10px;cursor:pointer;transition:all var(--t)}
    .bs-add-btn:hover{color:var(--text);border-color:var(--accent);background:var(--accent-bg)}
    .bs-card{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer}
    .bs-card:last-child{border-bottom:none}
    .bs-card:hover .bs-card-title{color:var(--accent)}
    .bs-card-info{flex:1;min-width:0}
    .bs-card-title{font-family:var(--book-font);font-size:.88rem;color:var(--text);transition:color var(--t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .bs-card-author{font-family:var(--ui-font);font-size:.62rem;color:var(--text-d);margin-top:2px}
    .bs-card-badge{font-family:var(--ui-font);font-size:.56rem;color:var(--accent);margin-top:4px}
    .bs-card-remove{background:none;border:none;color:var(--text-d);cursor:pointer;font-size:.8rem;padding:2px 4px;transition:color var(--t);flex-shrink:0}
    .bs-card-remove:hover{color:#f55}
    .bs-empty{font-family:var(--ui-font);font-size:.72rem;color:var(--text-d);font-style:italic;text-align:center;padding:16px 0}

    /* ── Sky Library ─────────────────────────────────────────── */
    #sky-overlay{position:fixed;inset:0;z-index:100;display:none;background:#080406}
    #sky-overlay.active{display:block}
    #sky-bg,#sky-main{position:absolute;inset:0;width:100%;height:100%}
    #sky-main{z-index:1}
    #sky-hud{position:absolute;top:16px;left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:20;pointer-events:none}
    .sky-pill{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:rgba(200,185,230,0.45);font-family:Georgia,serif;border:0.5px solid rgba(200,185,230,0.12);padding:3px 10px;border-radius:20px}
    #sky-back-btn{position:absolute;top:14px;left:16px;z-index:30;display:none;background:none;border:0.5px solid rgba(200,185,230,0.25);color:rgba(200,185,230,0.7);font-family:Georgia,serif;font-size:11px;padding:4px 12px;border-radius:20px;cursor:pointer;letter-spacing:.08em}
    #sky-back-btn:hover{border-color:rgba(200,185,230,0.6);color:rgba(200,185,230,1)}
    #sky-recenter-btn{position:absolute;top:14px;right:16px;z-index:30;display:none;background:none;border:0.5px solid rgba(200,185,230,0.25);color:rgba(200,185,230,0.7);font-family:Georgia,serif;font-size:11px;padding:4px 12px;border-radius:20px;cursor:pointer;letter-spacing:.08em}
    #sky-recenter-btn:hover{border-color:rgba(200,185,230,0.6);color:rgba(200,185,230,1)}
    #sky-tooltip{position:absolute;pointer-events:none;z-index:40;display:none;background:rgba(8,3,14,0.95);border:0.5px solid rgba(220,160,200,0.25);border-radius:10px;padding:12px 16px;max-width:240px}
    #sky-tooltip h3{font-family:Georgia,serif;font-size:13px;color:#f0e0ff;font-weight:400;margin-bottom:2px}
    #sky-tooltip .sky-tt-meta{font-size:10px;color:rgba(220,160,200,0.7);margin-bottom:6px;font-family:Georgia,serif}
    #sky-tooltip p{font-size:11px;color:rgba(210,190,230,0.75);line-height:1.6;font-family:Georgia,serif}

<script type="module">
// ── §1 DB ────────────────────────────────────────────────────────────────────

const DB_NAME = 'audio-book-library';
const DB_VERSION = 1;
const STORE = 'books';

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      req.result.createObjectStore(STORE, { keyPath: 'id' });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function saveBook(entry) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put(entry);
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
}

async function getBook(id) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readonly');
    const req = tx.objectStore(STORE).get(id);
    req.onsuccess = () => resolve(req.result ?? null);
    req.onerror = () => reject(req.error);
  });
}

async function getAllBooks() {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readonly');
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function removeBook(id) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).delete(id);
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
}

// ── §2 GITHUB ────────────────────────────────────────────────────────────────

const LS_TOKEN = 'isabelle-v2-github-token';

function getConfig() {
  if (typeof window === 'undefined') return null;
  const token = localStorage.getItem(LS_TOKEN);
  const match = window.location.hostname.match(/^([^.]+)\.github\.io$/);
  if (!match) return null;
  const owner = match[1];
  const repo = document.documentElement.dataset.repo || 'isabelle';
  if (!token) return null;
  return { owner, repo, token };
}

function utf8ToBase64(str) {
  if (typeof btoa !== 'undefined') {
    return btoa(unescape(encodeURIComponent(str)));
  }
  return Buffer.from(str, 'utf8').toString('base64');
}

async function fetchFromGitHub(filename) {
  const cfg = getConfig();
  if (!cfg) throw Object.assign(new Error('missing_config'), { code: 'missing_config' });
  const res = await fetch(
    `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${filename}`,
    {
      headers: {
        Authorization: `Bearer ${cfg.token}`,
        Accept: 'application/vnd.github+json',
      },
    }
  );
  if (res.status === 401 || res.status === 403 || res.status === 404) {
    throw Object.assign(new Error('bad_token'), { code: 'bad_token' });
  }
  if (res.status === 429) {
    throw Object.assign(new Error('rate_limited'), { code: 'rate_limited' });
  }
  if (!res.ok) throw new Error(`github_error_${res.status}`);
  const data = await res.json();
  const jsonStr =
    typeof atob !== 'undefined'
      ? decodeURIComponent(escape(atob(data.content.replace(/\s/g, ''))))
      : Buffer.from(data.content, 'base64').toString('utf8');
  return { content: JSON.parse(jsonStr), sha: data.sha };
}

async function saveToGitHub(filename, content) {
  const cfg = getConfig();
  if (!cfg) throw Object.assign(new Error('missing_config'), { code: 'missing_config' });

  let sha;
  try {
    const current = await fetchFromGitHub(filename);
    sha = current.sha;
  } catch (e) {
    if (e.code === 'missing_config' || e.code === 'bad_token') throw e;
    throw Object.assign(new Error('get_failed'), { code: 'get_failed' });
  }

  const raw = JSON.stringify(content, null, 2);
  const body = JSON.stringify({
    message: `update ${filename}`,
    content: utf8ToBase64(raw),
    sha,
  });

  const res = await fetch(
    `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${filename}`,
    {
      method: 'PUT',
      headers: {
        Authorization: `Bearer ${cfg.token}`,
        'Content-Type': 'application/json',
        Accept: 'application/vnd.github+json',
      },
      body,
    }
  );

  if (res.status === 409 || res.status === 422) {
    throw Object.assign(new Error('sha_conflict'), { code: 'sha_conflict' });
  }
  if (res.status === 401 || res.status === 403 || res.status === 404) {
    throw Object.assign(new Error('bad_token'), { code: 'bad_token' });
  }
  if (res.status === 429) {
    throw Object.assign(new Error('rate_limited'), { code: 'rate_limited' });
  }
  if (!res.ok) throw new Error(`github_error_${res.status}`);
}

function getToken() {
  return typeof localStorage !== 'undefined' ? localStorage.getItem(LS_TOKEN) || '' : '';
}
function setToken(t) {
  if (typeof localStorage !== 'undefined') localStorage.setItem(LS_TOKEN, t);
}

// ── §3 LOADER ────────────────────────────────────────────────────────────────

const LS_POSITION = 'isabelle-v2-position';

let _currentBookId = null;

async function loadData() {
  const params = new URLSearchParams(location.search);
  if (location.protocol === 'file:') {
    const id = params.get('id');
    if (id) return loadFromIDB(id);
    // No ?id — auto-load most recently opened book from IDB (no permissions needed)
    const books = await getAllBooks();
    if (books.length === 0)
      throw Object.assign(new Error('no_books'), { code: 'no_books' });
    const recent = books.sort((a, b) => (b.lastOpened || 0) - (a.lastOpened || 0))[0];
    history.replaceState(null, '', `?id=${encodeURIComponent(recent.id)}`);
    return loadFromIDB(recent.id);
  }
  // HTTP — fetch from root or named subdirectory
  const dir = params.get('dir');
  const base = dir ? `./${dir}` : './data';
  const [bookRes, ctxRes, fictRes] = await Promise.all([
    fetch(`${base}/book.json`),
    fetch(`${base}/context.json`),
    fetch(`${base}/fiction.json`),
  ]);
  if (!bookRes.ok) throw new Error('book_fetch_failed');
  const book    = await bookRes.json();
  const context = ctxRes.ok  ? await ctxRes.json()  : { entries: [] };
  const fiction = fictRes.ok ? await fictRes.json() : { gap_scenes: [], letter_reimaginings: [] };
  return { book, context, fiction };
}

async function loadFromIDB(id) {
  const entry = await getBook(id);
  if (!entry || !entry.bundle) throw new Error('book_not_found');
  _currentBookId = id;
  const { book, context = { entries: [] }, fiction = { gap_scenes: [], letter_reimaginings: [] } } = entry.bundle;
  return { book, context, fiction };
}

function downloadBundle(book, context, fiction) {
  const bundle = { book, context, fiction };
  const blob = new Blob([JSON.stringify(bundle, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${(book.title || 'book').replace(/[^a-z0-9]/gi, '-').toLowerCase()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function resolvePosition(local, remote) {
  const fallback = {
    letter_id: 'letter-001',
    paragraph_index: 0,
    scroll_offset: 0,
    active_view: 'plain_english',
    timestamp: 0,
  };
  if (!local && !remote) return fallback;
  if (!local) return remote;
  if (!remote) return local;
  return local.timestamp >= remote.timestamp ? local : remote;
}

function loadLocalPosition() {
  try {
    const raw = localStorage.getItem(LS_POSITION);
    return raw ? JSON.parse(raw) : null;
  } catch {
    return null;
  }
}

function saveLocalPosition(pos) {
  localStorage.setItem(LS_POSITION, JSON.stringify({ ...pos, timestamp: Date.now() }));
}

// ── §4 RENDERER ──────────────────────────────────────────────────────────────

const VIEW_LABELS = {
  original_french:        { tab: 'vieux français', tip: 'Original Old French' },
  modern_french:          { tab: 'français',       tip: 'Modern French' },
  literal_english_old:    { tab: 'literal',        tip: 'Literal English — preserves Old French syntax' },
  literal_english_modern: { tab: 'narration',      tip: 'Audio-ready English narration' },
  plain_english:          { tab: 'english',        tip: 'Plain Modern English' },
  handwriting_style:      { tab: 'manuscrit',      tip: 'Handwriting Style' },
  photocopy:              { tab: 'photocopie',     tip: 'Original Photocopy' },
};
const TEXT_VIEWS = [
  'original_french',
  'modern_french',
  'literal_english_old',
  'literal_english_modern',
  'plain_english',
];

function buildAliasMap(entries) {
  const map = new Map();
  for (const entry of entries) {
    const names = [entry.name, ...(entry.aliases || [])];
    for (const name of names) {
      if (name) map.set(String(name).toLowerCase(), entry.id);
    }
  }
  return map;
}

function buildSortedAliases(aliasMap) {
  return [...aliasMap.entries()].sort((a, b) => b[0].length - a[0].length);
}

function injectContextSpans(el, sortedAliases, doc) {
  const walker = doc.createTreeWalker(el, 4);
  const textNodes = [];
  let node;
  while ((node = walker.nextNode())) textNodes.push(node);

  for (const tn of textNodes) {
    const text = tn.nodeValue;
    let html = text;
    let matched = false;
    for (const [alias, id] of sortedAliases) {
      if (alias.length < 4) continue;
      const re = new RegExp(`(?<![\\w-])(${escapeRe(alias)})(?![\\w-])`, 'gi');
      const next = html.replace(
        re,
        `<span class="ctx-ref" data-ref-id="${id}" role="button" tabindex="0" aria-label="Context: ${id}">$1</span>`
      );
      if (next !== html) {
        matched = true;
        html = next;
      }
    }
    if (matched) {
      const span = doc.createElement('span');
      span.innerHTML = html;
      tn.parentNode.replaceChild(span, tn);
    }
  }
}

function escapeRe(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function renderLetterMeta(letter, doc) {
  const div = doc.createElement('div');
  div.className = 'letter-meta';
  div.dataset.letterId = letter.id;
  div.innerHTML = `
    <span data-letter-date class="letter-date">${letter.date_display || ''}</span>
    <span data-letter-number class="letter-number">Letter ${letter.letter_number}</span>
  `;
  return div;
}

function renderViewSwitcher(letter, activeView, onSwitch, doc) {
  const nav = doc.createElement('nav');
  nav.className = 'view-switcher';
  nav.setAttribute('role', 'tablist');
  nav.setAttribute('aria-label', 'Letter format view');

  for (const [key, { tab, tip }] of Object.entries(VIEW_LABELS)) {
    const btn = doc.createElement('button');
    btn.setAttribute('role', 'tab');
    btn.dataset.view = key;
    btn.textContent = tab;
    btn.dataset.tip = tip;
    btn.setAttribute('aria-selected', key === activeView ? 'true' : 'false');
    if (key === activeView) btn.classList.add('active');
    btn.addEventListener('click', () => onSwitch(key));
    nav.appendChild(btn);
  }
  return nav;
}

function renderLetterBody(letter, activeView, sortedAliases, doc) {
  const article = doc.createElement('article');
  article.className = 'letter-body';
  article.dataset.letterId = letter.id;
  article.dataset.view = activeView;

  if (activeView === 'photocopy') {
    renderPhotocopy(letter, article, doc);
    return article;
  }

  const sourceText =
    activeView === 'handwriting_style'
      ? letter.views.original_french
      : letter.views[activeView];

  if (!sourceText) {
    const notice = doc.createElement('p');
    notice.className = 'view-missing';
    notice.textContent = 'This version has not been added yet.';
    article.appendChild(notice);
    return article;
  }

  if (letter.salutation) {
    const sal = doc.createElement('p');
    sal.className = 'letter-salutation';
    sal.textContent = letter.salutation;
    article.appendChild(sal);
  }

  const paragraphs = sourceText.split(/\n\n+/).filter(Boolean);
  for (let i = 0; i < paragraphs.length; i++) {
    const p = doc.createElement('p');
    p.className = 'letter-paragraph';
    p.dataset.paragraphIndex = String(i);
    p.textContent = paragraphs[i];
    if (TEXT_VIEWS.includes(activeView) && sortedAliases.length) {
      injectContextSpans(p, sortedAliases, doc);
    }
    if (activeView === 'handwriting_style') p.classList.add('handwriting');
    article.appendChild(p);
  }

  if (letter.closing) {
    const closing = doc.createElement('p');
    closing.className = 'letter-closing';
    closing.textContent = letter.closing;
    article.appendChild(closing);
  }
  return article;
}

function renderPhotocopy(letter, container, doc) {
  if (letter.images?.photocopy) {
    const img = doc.createElement('img');
    img.src = letter.images.photocopy;
    img.alt = letter.images.photocopy_alt || `Letter ${letter.letter_number}`;
    img.className = 'photocopy-img';
    img.addEventListener('error', () => renderPhotocopyFallback(letter, container, doc));
    container.appendChild(img);
  } else {
    renderPhotocopyFallback(letter, container, doc);
  }
}

function renderPhotocopyFallback(letter, container, doc) {
  container.innerHTML = '';
  container.classList.add('photocopy-fallback');
  const notice = doc.createElement('p');
  notice.className = 'photocopy-notice';
  notice.textContent = letter.images?.photocopy
    ? 'Image could not be loaded — showing transcription.'
    : 'Original image not yet added — showing transcription.';
  container.appendChild(notice);
  const text = letter.views?.original_french || '';
  text
    .split(/\n\n+/)
    .filter(Boolean)
    .forEach((para) => {
      const p = doc.createElement('p');
      p.className = 'letter-paragraph handwriting';
      p.textContent = para;
      container.appendChild(p);
    });
}

function renderLetterNav(letter, totalLetters, onPrev, onNext, doc) {
  const nav = doc.createElement('nav');
  nav.className = 'letter-nav';
  const prev = doc.createElement('button');
  prev.className = 'letter-nav-prev';
  prev.setAttribute('aria-label', 'Previous letter');
  prev.textContent =
    letter.letter_number <= 1 ? '← —' : `← Letter ${letter.letter_number - 1}`;
  prev.disabled = letter.letter_number <= 1;
  prev.addEventListener('click', onPrev);
  const next = doc.createElement('button');
  next.className = 'letter-nav-next';
  next.setAttribute('aria-label', 'Next letter');
  next.textContent =
    letter.letter_number >= totalLetters
      ? '— →'
      : `Letter ${letter.letter_number + 1} →`;
  next.disabled = letter.letter_number >= totalLetters;
  next.addEventListener('click', onNext);
  nav.appendChild(prev);
  nav.appendChild(next);
  return nav;
}

// ── §5 PLAYER ────────────────────────────────────────────────────────────────

function splitSentences(text) {
  if (!text) return [];
  const parts = text.split(/(?<=[.!?…»])\s+(?=[A-ZÀ-Ö«"'])/);
  return parts.map((s) => s.trim()).filter(Boolean);
}

function buildSentenceContextMap(sentences, sortedAliases) {
  const map = new Map();
  for (let i = 0; i < sentences.length; i++) {
    const lower = sentences[i].toLowerCase();
    for (const [alias, id] of sortedAliases) {
      if (alias.length >= 4 && lower.includes(alias)) {
        map.set(i, id);
        break;
      }
    }
  }
  return map;
}

class Player {
  constructor({ onParagraphAdvance, onWord, onEnd, onContextSnippet } = {}) {
    this.onParagraphAdvance = onParagraphAdvance || (() => {});
    this.onWord = onWord || (() => {});
    this.onEnd = onEnd || (() => {});
    this.onContextSnippet = onContextSnippet || (() => {});
    this.letterVoice = null;
    this.contextVoice = null;
    this.rate = 1;
    this.mode = 'letters';
    this.playing = false;
    this._sentences = [];
    this._sentenceIndex = 0;
    this._paragraphIndex = 0;
    this._paragraphs = [];
    this._contextDelay = 1200;
    this._spokenInParagraph = new Set();
    this._sortedAliases = [];
    this._watchdog = null;
    this._contextVerbosity = 'short';
    this._contextEntries = {};
  }

  setData({ paragraphs, sortedAliases, contextEntries }) {
    this._paragraphs = paragraphs || [];
    this._sortedAliases = sortedAliases || [];
    this._contextEntries = contextEntries || {};
  }

  setRate(r) {
    this.rate = r;
  }
  setMode(m) {
    this.mode = m;
  }
  setContextDelay(ms) {
    this._contextDelay = ms;
  }
  setContextVerbosity(v) {
    this._contextVerbosity = v;
  }

  setLetterVoice(voiceURI) {
    if (typeof window === 'undefined' || !window.speechSynthesis) return;
    const voices = window.speechSynthesis.getVoices();
    this.letterVoice = voices.find((v) => v.voiceURI === voiceURI) || null;
  }

  setContextVoice(voiceURI) {
    if (typeof window === 'undefined' || !window.speechSynthesis) return;
    const voices = window.speechSynthesis.getVoices();
    this.contextVoice = voices.find((v) => v.voiceURI === voiceURI) || null;
  }

  autoSelectVoices() {
    if (typeof window === 'undefined' || !window.speechSynthesis) return;
    const voices = window.speechSynthesis.getVoices();
    this.letterVoice = voices.find((v) => v.lang.startsWith('fr')) || voices[0] || null;
    this.contextVoice = voices.find((v) => v.lang.startsWith('en')) || voices[0] || null;
  }

  play() {
    if (this.mode === 'silent' || typeof window === 'undefined' || !window.speechSynthesis)
      return;
    this.playing = true;
    this._speakCurrentParagraph();
  }

  pause() {
    this.playing = false;
    this._clearWatchdog();
    if (typeof window !== 'undefined' && window.speechSynthesis) {
      window.speechSynthesis.cancel();
    }
  }

  stop() {
    this.pause();
    this._paragraphIndex = 0;
    this._sentenceIndex = 0;
  }

  skipNext() {
    this._advanceParagraph(1);
  }
  skipPrev() {
    this._advanceParagraph(-1);
  }

  setIndex(i) {
    this._paragraphIndex = i;
    this._sentenceIndex = 0;
    this._spokenInParagraph.clear();
  }

  _speakCurrentParagraph() {
    const para = this._paragraphs[this._paragraphIndex];
    if (!para) {
      this.playing = false;
      this.onEnd();
      return;
    }
    const text = para.text || para;
    this._sentences = splitSentences(text);
    this._sentenceIndex = 0;
    this._spokenInParagraph.clear();
    this._speakSentence();
  }

  _speakSentence() {
    if (!this.playing) return;
    if (this._sentenceIndex >= this._sentences.length) {
      this._advanceParagraph(1);
      return;
    }
    const sentence = this._sentences[this._sentenceIndex];
    this._speakUtterance(sentence, this.letterVoice, () => {
      if (this.mode === 'both' && this._contextVerbosity !== 'off') {
        const ctxId = this._findContextRef(sentence);
        if (ctxId && !this._spokenInParagraph.has(ctxId)) {
          this._spokenInParagraph.add(ctxId);
          setTimeout(() => this._speakContextSnippet(ctxId), this._contextDelay);
          return;
        }
      }
      this._sentenceIndex++;
      this._speakSentence();
    });
  }

  _speakContextSnippet(entryId) {
    if (!this.playing) return;
    const entry = this._contextEntries[entryId];
    if (!entry) {
      this._sentenceIndex++;
      this._speakSentence();
      return;
    }
    this.onContextSnippet(entryId);
    this._speakUtterance(entry.short || '', this.contextVoice, () => {
      setTimeout(() => {
        this._sentenceIndex++;
        this._speakSentence();
      }, this._contextDelay);
    });
  }

  _findContextRef(sentence) {
    const lower = sentence.toLowerCase();
    for (const [alias, id] of this._sortedAliases) {
      if (alias.length >= 4 && lower.includes(alias)) return id;
    }
    return null;
  }

  _speakUtterance(text, voice, onDone) {
    if (typeof window === 'undefined' || !window.speechSynthesis) {
      onDone();
      return;
    }
    window.speechSynthesis.cancel();
    const utt = new SpeechSynthesisUtterance(text);
    if (voice) utt.voice = voice;
    utt.rate = this.rate;
    utt.onboundary = (e) => {
      if (e.name === 'word')
        this.onWord(e.charIndex, e.charLength || 1, this._paragraphIndex);
    };
    utt.onend = () => {
      this._clearWatchdog();
      onDone();
    };
    utt.onerror = () => {
      this._clearWatchdog();
      onDone();
    };

    const watchdogMs = Math.max(5000, text.length * 80);
    this._watchdog = setTimeout(() => {
      console.warn('Player: watchdog triggered for utterance');
      window.speechSynthesis.cancel();
      onDone();
    }, watchdogMs);

    window.speechSynthesis.speak(utt);
  }

  _advanceParagraph(delta) {
    this._paragraphIndex = Math.max(
      0,
      Math.min(this._paragraphIndex + delta, this._paragraphs.length - 1)
    );
    this.onParagraphAdvance(this._paragraphIndex);
    if (this.playing && delta > 0) this._speakCurrentParagraph();
  }

  _clearWatchdog() {
    if (this._watchdog) {
      clearTimeout(this._watchdog);
      this._watchdog = null;
    }
  }
}

// ── §6 FOCUS MODE ────────────────────────────────────────────────────────────

let _mode = 'off';
let _currentIndex = 0;
let _paragraphEls = [];

function initFocusMode(paragraphEls) {
  _paragraphEls = paragraphEls || [];
}

function setFocusMode(mode) {
  _mode = mode;
  applyMode(_currentIndex);
}

function getFocusMode() {
  return _mode;
}

function applyMode(index) {
  _currentIndex = index;
  if (_mode === 'off') {
    _paragraphEls.forEach((el) => {
      el.style.opacity = '';
      el.style.display = '';
    });
    return;
  }
  if (_mode === 'reveal') {
    _paragraphEls.forEach((el, i) => {
      el.style.display = i <= index ? '' : 'none';
      el.style.opacity = '';
    });
    return;
  }
  if (_mode === 'spotlight') {
    _paragraphEls.forEach((el, i) => {
      el.style.display = i === index ? '' : 'none';
      el.style.opacity = '';
    });
    return;
  }
  if (_mode === 'fade_ahead') {
    _paragraphEls.forEach((el, i) => {
      el.style.display = i <= index + 3 ? '' : 'none';
      el.style.opacity = i === index ? '1' : i <= index + 3 ? '0.15' : '0';
    });
    return;
  }
  if (_mode === 'page') {
    _paragraphEls.forEach((el) => {
      el.style.opacity = '';
      el.style.display = '';
    });
  }
}

// ── §7 EXPORTER ──────────────────────────────────────────────────────────────

const EXPORT_TEXT_VIEWS = [
  'original_french',
  'modern_french',
  'literal_english_old',
  'literal_english_modern',
  'plain_english',
];
const EXPORT_VIEW_LABELS = {
  original_french: 'Vieux Français',
  modern_french: 'Français Moderne',
  literal_english_old: 'Anglais Littéral (vieux)',
  literal_english_modern: 'Anglais Littéral (moderne)',
  plain_english: 'Anglais Moderne',
};

function exportLetters({ letters, scope, view, format, selectionText }) {
  let subset;
  if (scope === 'selection') {
    subset = [
      {
        id: 'selection',
        letter_number: 0,
        date_display: '',
        views: { plain_english: selectionText },
        contextRefs: [],
      },
    ];
  } else if (scope === 'this-letter') {
    subset = letters.slice(0, 1);
  } else {
    subset = letters;
  }

  const views = view === 'all' ? EXPORT_TEXT_VIEWS : [view];

  if (format === 'plain-text') {
    const text = subset
      .map((l) => views.map((v) => l.views?.[v] || '').join('\n\n---\n\n'))
      .join('\n\n═══\n\n');
    download(text, 'isabelle-letters.txt', 'text/plain');
    return;
  }

  if (format === 'print') {
    const win = window.open('', '_blank');
    win.document.write(buildHtmlDoc(subset, views, true));
    win.document.close();
    win.print();
    return;
  }

  const html = buildHtmlDoc(subset, views, false);
  download(html, 'isabelle-letters.html', 'text/html');
}

function buildHtmlDoc(letters, views, forPrint) {
  const toc = letters
    .map(
      (l) =>
        `<li><a href="#${l.id}">${l.date_display || ''} — Letter ${l.letter_number}</a></li>`
    )
    .join('');

  const body = letters
    .map((l) => {
      const sections = views
        .map((v) => {
          const text = l.views?.[v];
          if (!text) return '';
          return `<section class="view-section">
        <h3>${EXPORT_VIEW_LABELS[v] || v}</h3>
        ${text.split(/\n\n+/).map((p) => `<p>${escapeHtml(p)}</p>`).join('')}
      </section>`;
        })
        .join('');
      return `<article id="${l.id}" class="letter-export">
      <header><time>${escapeHtml(l.date_display || '')}</time><span>Letter ${l.letter_number}</span></header>
      ${l.salutation ? `<p class="salutation">${escapeHtml(l.salutation)}</p>` : ''}
      ${sections}
      ${l.closing ? `<p class="closing">${escapeHtml(l.closing)}</p>` : ''}
    </article>`;
    })
    .join('<hr>');

  return `<!DOCTYPE html><html lang="en" translate="no"><head><meta charset="utf-8">
  <meta name="google" content="notranslate">
  <title>Isabelle — Letters</title>
  <style>
    body{font-family:Georgia,serif;max-width:720px;margin:2rem auto;color:#1a1a1a;line-height:1.75}
    header{display:flex;justify-content:space-between;font-size:.8rem;color:#666;margin-bottom:1rem}
    h3{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:#888;margin:1.5rem 0 .5rem}
    .salutation,.closing{font-style:italic}
    .closing{text-align:right;margin-top:1.5rem}
    article{margin-bottom:3rem}
    ${forPrint ? '@media print{hr{display:none}}' : ''}
  </style></head><body>
  <nav><ol>${toc}</ol></nav>
  ${body}
  </body></html>`;
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function download(content, filename, type) {
  try {
    const blob = new Blob([content], { type });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  } catch {
    document.dispatchEvent(new CustomEvent('export-failed'));
  }
}

function isEnabled(id) {
  const val = localStorage.getItem(LS_PREFIX + id);
  return val === null ? true : val === '1';
}

function setEnabled(id, on) {

function initKeyboardNav({
  onPrev,
  onNext,
  onToggleContext,
  onToggleChrome,
  onPeek,
  onRangeCopy,
}) {
  document.addEventListener('keydown', (e) => {
    if (!isEnabled('keyboard-nav')) return;
    const tag = document.activeElement?.tagName;
    if (['INPUT', 'TEXTAREA', 'SELECT'].includes(tag)) return;
    if (e.target?.isContentEditable) return;

    if (e.key === 'ArrowLeft') {
      e.preventDefault();
      onPrev?.();
    } else if (e.key === 'ArrowRight') {
      e.preventDefault();
      onNext?.();
    } else if (e.key === 'c' || e.key === 'C') onToggleContext?.();
    else if (e.key === 'H' && e.shiftKey) onToggleChrome?.();
    else if (e.key === 'p' || e.key === 'P') onPeek?.();
    else if (e.key === 'r' || e.key === 'R') onRangeCopy?.();
    else if (e.key === 'Escape') document.dispatchEvent(new CustomEvent('escape-pressed'));
  });
}

function initSmartScroll(contentEl) {

function snapToNearestAnchor(el) {
  if (!isEnabled('smart-scroll')) return;
  const anchors = [...el.querySelectorAll('.letter-body')];
  const scrollTop = el.scrollTop;
  const viewMid = scrollTop + el.clientHeight / 2;
  let closest = null;
  let closestDist = Infinity;
  for (const a of anchors) {
    const dist = Math.abs(a.offsetTop - viewMid);
    if (dist < closestDist) {
      closestDist = dist;
      closest = a;
    }
  }
  if (closest && closestDist < 80) {
    el.scrollTo({ top: closest.offsetTop - 20, behavior: 'smooth' });
  }
}

// ── Letter Integrity Guardian ─────────────────────────────────────────────────
// Detects artefacts in letter text and returns annotated segments for rendering.
// Same patterns as scripts/clean-letters.js — keep in sync if patterns change.

const GUARDIAN_PATTERNS = [
  {
    id:     'header',
    re:     /^Letter\s+\d+[\s\S]{0,20}?(?=[A-Z][a-z])/,
    label:  'Header artefact',
    tip:    'Extraction duplicate — "Letter N" prefix from source HTML',
    cls:    'guardian-header',
  },
  {
    id:     'folio',
    re:     /\[(?:f|p)\.\s*[\d\w\-|,\s]+?\]/gi,
    label:  'Folio reference',
    tip:    'Archival folio ref — should be in metadata, not letter body',
    cls:    'guardian-folio',
  },
  {
    id:     'footnote',
    re:     /(?<!\d)\d{1,2}\.\s+[A-ZÀÂÇÉÈÊËÎÏÔÙÛÜ].{10,}/g,
    label:  'Historian footnote',
    tip:    "Historian's editorial note — not Isabelle's writing; Book 2 candidate",
    cls:    'guardian-footnote',
  },
  {
    id:     'inline_marker',
    re:     /[ \u00A0][1-9](?=[ ,;.!?»])/g,
    label:  'Footnote marker',
    tip:    'Superscript reference number pointing to an editorial footnote',
    cls:    'guardian-marker',
  },
  {
    id:     'ocr',
    re:     /[|}{\\]/g,
    label:  'OCR damage',
    tip:    'Character that indicates OCR scanning damage — manual repair needed',
    cls:    'guardian-ocr',
  },
];

/**
 * Analyse text and return array of { start, end, patternId, label, tip }.
 * Ranges are character offsets into `text`.
 */
function guardianAnalyse(text) {
  if (!text) return [];
  const hits = [];
  for (const pat of GUARDIAN_PATTERNS) {
    const re = new RegExp(pat.re.source, pat.re.flags.includes('g') ? pat.re.flags : pat.re.flags + 'g');
    let m;
    while ((m = re.exec(text)) !== null) {
      hits.push({ start: m.index, end: m.index + m[0].length, patternId: pat.id, label: pat.label, tip: pat.tip, cls: pat.cls });
    }
  }
  // Sort by start position, remove overlaps (first match wins)
  hits.sort((a, b) => a.start - b.start);
  const merged = [];
  let cursor = 0;
  for (const h of hits) {
    if (h.start >= cursor) { merged.push(h); cursor = h.end; }
  }
  return merged;
}

/**
 * Wrap detected artefact ranges in <mark class="guardian-*"> elements inside `el`.
 * Works on text nodes only — does not re-process already-wrapped nodes.
 * Call after renderLetterBody when guardian is enabled.
 */
function guardianHighlight(el, text, doc) {
  if (!isEnabled('letter-guardian')) return;
  const hits = guardianAnalyse(text);
  if (!hits.length) return;

  // Build annotated HTML from plain text + hit ranges
  let html = '';
  let cursor = 0;
  function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  for (const h of hits) {
    html += esc(text.slice(cursor, h.start));
    html += `<mark class="guardian-flag ${h.cls}" data-tip="${esc(h.tip)}" aria-label="${esc(h.label)}: ${esc(h.tip)}">${esc(text.slice(h.start, h.end))}</mark>`;
    cursor = h.end;
  }
  html += esc(text.slice(cursor));

  // Replace the first paragraph's text node with the annotated HTML
  // (guardian applies to the raw concatenated text, injected into the first <p>)
  const firstP = el.querySelector('.letter-paragraph');
  if (firstP) {
    const wrapper = doc.createElement('span');
    wrapper.innerHTML = html;
    firstP.innerHTML = '';
    firstP.appendChild(wrapper);
  }
}

/**
 * Return a plain-text summary of all issues in a letter for the editor banner.
 */
function guardianSummary(text) {
  const hits = guardianAnalyse(text);
  if (!hits.length) return null;
  const counts = {};
  for (const h of hits) counts[h.label] = (counts[h.label] || 0) + 1;
  return Object.entries(counts).map(([k, v]) => `${v}× ${k}`).join(' · ');
}

let _unlocked = false;

function initEditor({ onPause, onSave }) {

function isEditorUnlocked() {

function toggleEditorMode() {

    indicator.setAttribute('aria-pressed', _unlocked ? 'true' : 'false');

function attachLongPress(el, callback) {
  let timer = null;
  el.addEventListener('pointerdown', () => {
    timer = setTimeout(callback, LONG_PRESS_MS);
  });

}

function openInlineEdit(el) {

  tb.style.top = `${rect.top - 48}px`;

  else if (command === 'italic') document.execCommand('italic');

function renderMappingEditor(
  { letter, contextEntries, onLink, onUnlink, onCreate },
  doc
) {
  const panel = doc.createElement('div');
  panel.className = 'mapping-editor';
  panel.setAttribute('aria-label', `Connections for Letter ${letter.letter_number}`);

  const title = doc.createElement('h3');
  title.textContent = `Letter ${letter.letter_number} — ${letter.date_display || ''}`;
  panel.appendChild(title);

  const list = doc.createElement('ul');
  list.className = 'mapping-list';
  for (const refId of letter.contextRefs) {
    const entry = contextEntries[refId];
    if (!entry) continue;
    const li = doc.createElement('li');
    li.textContent = entry.name;
    const remove = doc.createElement('button');
    remove.textContent = '✕';
    remove.setAttribute('aria-label', `Remove link to ${entry.name}`);
    remove.addEventListener('click', () => {
      onUnlink(refId);
      li.remove();
    });
    li.appendChild(remove);
    list.appendChild(li);
  }
  panel.appendChild(list);

  const addBtn = doc.createElement('button');
  addBtn.className = 'add-connection';
  addBtn.textContent = '+ Add connection';
  addBtn.addEventListener('click', () =>
    openConnectionSearch(panel, contextEntries, letter, onLink, onCreate, doc)
  );
  panel.appendChild(addBtn);
  return panel;
}

function openConnectionSearch(panel, contextEntries, letter, onLink, onCreate, doc) {
  const existing = panel.querySelector('.connection-search');
  if (existing) existing.remove();

  const wrap = doc.createElement('div');
  wrap.className = 'connection-search';
  const input = doc.createElement('input');
  input.type = 'search';
  input.setAttribute('role', 'combobox');
  input.setAttribute('aria-label', 'Search context entries');
  input.setAttribute('aria-autocomplete', 'list');
  input.setAttribute('aria-expanded', 'true');
  const results = doc.createElement('ul');
  results.setAttribute('role', 'listbox');

  input.addEventListener('input', () => {
    const q = input.value.toLowerCase();
    results.innerHTML = '';
    const matches = Object.values(contextEntries)
      .filter((e) => e.name.toLowerCase().includes(q))
      .slice(0, 8);
    for (const entry of matches) {
      const li = doc.createElement('li');
      li.setAttribute('role', 'option');
      li.textContent = entry.name;
      li.addEventListener('click', () => {
        onLink(entry.id);
        wrap.remove();
      });
      results.appendChild(li);
    }
    if (q.length >= 2) {
      const create = doc.createElement('li');
      create.setAttribute('role', 'option');
      create.setAttribute('aria-label', `Create new entry: ${input.value}`);
      create.textContent = `No match — Create "${input.value}"`;
      create.addEventListener('click', () => onCreate(input.value, wrap));
      results.appendChild(create);
    }
  });

  wrap.appendChild(input);
  wrap.appendChild(results);
  panel.appendChild(wrap);
  input.focus();
}

const SNAP_FILENAME = 'isabelle-snapshot.json';

function downloadSnapshot({ letter_id, paragraph_index, active_view, letters_read }) {
  const snap = {
    letter_id,
    paragraph_index: paragraph_index || 0,
    active_view: active_view || 'plain_english',
    letters_read: Array.from(letters_read || []),
    timestamp: Date.now(),
  };
  const blob = new Blob([JSON.stringify(snap, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = SNAP_FILENAME;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

}

  document.getElementById('smart-features-panel').classList.remove('open');
  document.getElementById('export-panel').classList.remove('open');

}

  if (panel.classList.contains('open')) closeBookshelf();
  else openBookshelf();
